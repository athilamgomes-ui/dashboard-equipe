// ─── RENDER VISÃO ANUAL ───────────────────────────────────────────────────────

function renderAnual() {
  const meses = ['2026-05','2026-06','2026-07','2026-08','2026-09','2026-10','2026-11','2026-12'];
  const mesNomes = {
    '2026-05':'Mai','2026-06':'Jun','2026-07':'Jul','2026-08':'Ago',
    '2026-09':'Set','2026-10':'Out','2026-11':'Nov','2026-12':'Dez'
  };
  const lojas = ['L1','L3','L4','L5'];

  // Tabela: loja × mês  → faturamento e prêmios
  let thCols = meses.map(m=>`<th>${mesNomes[m]}</th>`).join('');
  let rows = '';

  // Acumulado por loja no ano (todos os meses populados)
  const acumLoja = {};
  lojas.forEach(lk => {
    const base = LOJAS_BASE[lk];
    acumLoja[lk] = 0;
    let cells = meses.map(mk => {
      const d = DADOS[mk];
      if (!d || !d[lk]) {
        const meta = METAS_FUTURAS[mk] ? METAS_FUTURAS[mk][lk] : '—';
        return `<td class="cell-muted" title="Meta: ${typeof meta==='number'?fR(meta):'—'}">—</td>`;
      }
      const ld = d[lk];
      const fat = ld.semanas.reduce((s,sem)=>{
        return s + Object.values(ld.vendas[sem.id]||{}).reduce((a,v)=>a+(v||0),0);
      },0);
      acumLoja[lk] += fat;
      const em = ld.meta_mensal > 0 ? fat/ld.meta_mensal*100 : 0;
      const col = em>=100?'cell-green':em>=80?'cell-yellow':'cell-red';
      return `<td class="${col}" title="${fP(em)} da meta">${fR(fat)}<br><small>${fP(em)}</small></td>`;
    }).join('');
    rows += `<tr><td class="loja-col" style="color:${base.cor}">${base.nome}</td>${cells}<td style="font-weight:700">${fR(acumLoja[lk])}</td></tr>`;
  });

  // Totais por mês
  let totCells = meses.map(mk => {
    const d = DADOS[mk];
    if (!d) return `<td class="cell-muted">—</td>`;
    let tot = 0;
    lojas.forEach(lk => {
      if (!d[lk]) return;
      d[lk].semanas.forEach(sem=>{
        tot += Object.values(d[lk].vendas[sem.id]||{}).reduce((a,v)=>a+(v||0),0);
      });
    });
    return `<td>${tot>0?fR(tot):'—'}</td>`;
  }).join('');
  const acumTotal = lojas.reduce((s,lk)=>s+acumLoja[lk],0);

  // Ranking acumulado de vendedoras — TODOS os meses populados do ano (era
  // hardcoded em '2026-05' e ficava desatualizado pra sempre; corrigido 04/07/2026).
  // Nomes vêm dos próprios dados de vendas (não do roster atual) pra não perder
  // quem saiu no meio do ano (ex.: Alcione vendeu em maio). Exclui Outros e caixa.
  let rankHtml = '';
  const rankData = {};
  let ultimoMesComDados = null;
  meses.forEach(mk => {
    const d = DADOS[mk];
    if (!d) return;
    lojas.forEach(lk => {
      const ld = d[lk];
      if (!ld) return;
      ultimoMesComDados = mk;
      ld.semanas.forEach(sem => {
        for (const [v, val] of Object.entries(ld.vendas[sem.id]||{})) {
          if (v === 'Outros' || isCaixa(v)) continue;
          const key = `${v} (${lk})`;
          rankData[key] = (rankData[key]||0) + (val||0);
        }
      });
    });
  });
  const ranked = Object.entries(rankData).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxVal = ranked[0]?.[1] || 1;
  rankHtml = ranked.map(([name, val], i) => `
    <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)">
      <span style="width:20px;text-align:right;color:var(--muted);font-size:12px">${i+1}</span>
      <span style="flex:1;font-size:13px">${name}</span>
      <div style="width:160px;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${val/maxVal*100}%;background:var(--green);border-radius:3px"></div>
      </div>
      <span style="width:90px;text-align:right;font-weight:700;color:var(--green)">${fR(val)}</span>
    </div>`).join('');

  return `
  <div class="nota" style="margin-top:16px">Visão consolidada maio–dezembro 2026. Meses futuros serão preenchidos automaticamente via ERP. Clique em uma aba de loja para ver detalhes.</div>

  <div class="sec-ttl">Faturamento por loja × mês</div>
  <div class="annual-table-wrap">
    <table class="annual-table">
      <thead><tr><th style="text-align:left">Loja</th>${thCols}<th>Acumulado</th></tr></thead>
      <tbody>
        ${rows}
        <tr class="grand"><td class="loja-col">TOTAL</td>${totCells}<td>${fR(acumTotal)}</td></tr>
      </tbody>
    </table>
  </div>

  <div class="sec-ttl">Top 10 vendedoras — acumulado ${mesNomes[meses[0]]}–${ultimoMesComDados?mesNomes[ultimoMesComDados]:'—'} 2026</div>
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;max-width:640px">
    ${rankHtml}
  </div>

  <div class="sec-ttl">Resumo de metas futuras configuradas</div>
  <div class="annual-table-wrap">
    <table class="annual-table">
      <thead><tr><th style="text-align:left">Loja</th>${['2026-06','2026-07','2026-08','2026-09','2026-10','2026-11','2026-12'].map(m=>`<th>${mesNomes[m]}</th>`).join('')}</tr></thead>
      <tbody>
        ${lojas.map(lk=>{
          const cells2 = ['2026-06','2026-07','2026-08','2026-09','2026-10','2026-11','2026-12'].map(mk=>{
            const m = METAS_FUTURAS[mk];
            return `<td class="cell-muted">${m?fR(m[lk]):'—'}</td>`;
          }).join('');
          return `<tr><td class="loja-col" style="color:${LOJAS_BASE[lk].cor}">${LOJAS_BASE[lk].nome}</td>${cells2}</tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>
  `;
}

// ─── SUGESTÕES ───────────────────────────────────────────────────────────────

const TIPO_LABELS = {
  script_venda:'Script de venda', treinamento:'Treinamento', marca:'Marca/Curva A',
  layout:'Layout/Vitrine', atendimento:'Atendimento', ticket_medio:'Ticket médio',
  meta:'Gestão de meta', comunicacao:'Comunicação', cliente_recorrente:'Cliente recorrente',
  elogio:'🏆 Elogio/Reconhecimento', avaliacao:'📋 Avaliação do mês'
};
const ALVO_LABELS = {
  atingir_meta:'Atingir meta', marcas_a:'% Marcas A', ticket_medio:'Ticket médio',
  conversao:'Conversão', vendas_individuais:'Vendas individuais', crescimento_yoy:'Crescimento vs ano anterior',
  venda_marca:'Venda de marca específica'
};
const RES_LABELS = {funcionou:'✓ Funcionou', indiferente:'➖ Indiferente', nao_funcionou:'✗ Não funcionou'};

// ─── AVALIAÇÃO OBJETIVA (baseline → resultado) ───────────────────────────────
// Pra cada sugestão calcula auto: baseline (sem anterior à publicação), resultado_real
// (sem em que foi avaliada) e status_objetivo (🟢 funcionou / 🟡 parcial / 🔴 não).
// Funciona pra meta_alvo ∈ {vendas_individuais, atingir_meta, marcas_a}.
// ticket_medio e conversao retornam null (não rastreáveis automaticamente — falta KPI).
//
// Thresholds default (podem ser overrideados em sug.threshold):
//   vendas_individuais → relativo_pct +15%
//   atingir_meta       → meta_pct  ≥100% (bateu meta da loja)
//   marcas_a           → absoluto_pp +5pp

const DEFAULT_THRESHOLDS = {
  vendas_individuais: {tipo:'relativo_pct', funcionou:15, parcial:5},      // +15% funcionou, +5% parcial
  atingir_meta:       {tipo:'meta_pct',     funcionou:100, parcial:90},    // ≥100% funcionou, ≥90% parcial
  marcas_a:           {tipo:'absoluto_pp',  funcionou:5,  parcial:2},      // +5pp / +2pp
  ticket_medio:       {tipo:'relativo_pct', funcionou:10, parcial:3},      // +10% funcionou, +3% parcial (TM move menos que vendas)
  venda_marca:        {tipo:'relativo_pct', funcionou:15, parcial:5},      // +15% funcionou, +5% parcial (unidades vendidas da marca)
  // Sugestão cuja promessa é um número do MÊS ("chegar nos R$31.000"), não da
  // semana. Avaliar por delta semanal responde a pergunta errada. Aqui o que
  // vale é o RITMO: quanto do objetivo já foi feito vs quanto deveria ter sido
  // feito a esta altura do mês (Athila, 21/07/2026).
  meta_mensal_individual: {tipo:'ritmo_mensal', funcionou:100, parcial:85},
  // % das vendedoras no ritmo do prêmio individual (sugestão da rede)
  corrida_mensal:         {tipo:'pct_equipe',   funcionou:50,  parcial:30}, // ≥100% do ritmo esperado / ≥85% parcial
};

// Faixas do prêmio individual do mês. Estavam só escritas no texto das sugestões
// (nunca como dado), então o motor não sabia dizer "faltam X pros R$31.000 e Y
// pros R$40.000" — pedido do Athila 21/07/2026: quando a projeção passa de uma
// faixa, a mensagem tem que mostrar as DUAS distâncias.
const FAIXAS_PREMIO_INDIVIDUAL = [
  {valor: 31000, premio: 100},
  {valor: 35000, premio: 200},
  {valor: 40000, premio: 300},
];
// Próxima faixa acima de um valor já conquistado (null se já está no topo).
function _proxFaixa(acumOuAlvo) {
  return FAIXAS_PREMIO_INDIVIDUAL.find(f => f.valor > acumOuAlvo) || null;
}

// Total do mês INTEIRO até a última coleta (inclui a semana em curso). Diferente
// do acumulado até a semana avaliada — é o número que a vendedora vê no app hoje.
// Sem isso a mensagem dizia "R$31.863 no mês" quando ela já estava em R$32.472,
// e o número não batia com a tela (Athila, 21/07/2026).
function _totalMesAtual(ld, vend) {
  return (ld?.semanas || []).filter(Boolean)
    .reduce((a, s) => a + _getVendasIndiv(ld, s.id, vend), 0);
}

// Fração do plano mensal que já venceu até o fim da semana `semIdAte`.
// Usa a distribuição REAL das metas semanais (não o calendário), porque as
// semanas têm pesos muito diferentes — na L1 de jul/2026 a S1 vale 14% do mês
// e a S2 vale 24%. Dividir por "3 de 5 semanas" daria um alvo torto.
function _fracaoPlanoAte(ld, semIdAte) {
  const sems = (ld?.semanas || []).filter(Boolean);
  const i = sems.findIndex(s => s.id === semIdAte);
  if (i < 0 || !ld.meta_mensal) return null;
  const ate = sems.slice(0, i + 1).reduce((a, s) => a + (s.meta || 0), 0);
  return ate / ld.meta_mensal;
}

// Série de vendas semanais FECHADAS da vendedora (até semIdAte, inclusive), com
// mediana e máximo. Serve pra testar se o "faltam R$X por semana" que vamos
// pedir é algo que ela já fez alguma vez — mesma lógica do scripts/baseline_justa.mjs.
// Sem isso o motor promete o impossível com cara de otimismo (caso Joyce, 21/07/2026:
// 51% do ritmo viraria "é alcançável" R$10.825/semana com melhor semana de R$5.152).
function _serieSemanalIndiv(ld, vend, semIdAte) {
  const sems = (ld?.semanas || []).filter(Boolean);
  const i = sems.findIndex(s => s.id === semIdAte);
  if (i < 0) return null;
  const vals = sems.slice(0, i + 1)
    .map(s => _getVendasIndiv(ld, s.id, vend))
    .filter(v => v > 0);
  if (!vals.length) return null;
  const ord = [...vals].sort((a, b) => a - b);
  const meio = Math.floor(ord.length / 2);
  return {
    n: ord.length,
    mediana: ord.length % 2 ? ord[meio] : (ord[meio - 1] + ord[meio]) / 2,
    maximo: ord[ord.length - 1],
  };
}

// Acumulado da vendedora no mês até o fim da semana `semIdAte` (inclusive).
function _acumIndivAte(ld, semIdAte, vend) {
  const sems = (ld?.semanas || []).filter(Boolean);
  const i = sems.findIndex(s => s.id === semIdAte);
  if (i < 0) return null;
  return sems.slice(0, i + 1)
    .reduce((a, s) => a + _getVendasIndiv(ld, s.id, vend), 0);
}

// ─── ELOGIOS — comparação de crescimento vs mesmo mês do ano anterior ────────
// Pedido do Athila (04/07/2026): reconhecer vendedora/loja que cresceu muito
// vs o mesmo mês do ano passado (ex: Rayra). Fonte: HIST_MENSAL_YOY['YYYY-MM']
// (mês de ANO ANTERIOR, coletado 1x/mês via ERP — mesmo endpoint do cron normal,
// só com o range de data do ano anterior). Ver [[premiacao_sugestoes_redesign]].
const ELOGIO_THRESHOLD_PCT = 20; // crescimento mínimo (%) pra virar sugestão de elogio

// Seed real (coletado 04/07/2026 via cron_etapa1_vendas.mjs, di=01/06/2025 df=30/06/2025):
// caso de origem — Rayra (L1) R$26.460 em jun/2025 → R$42.202 em jun/2026 = +59% (elogio real).
const HIST_MENSAL_YOY = {
  '2025-06': {
    L1: {Outros:78577, Rayra:26460},
    L3: {Outros:31317, Raimunda:22740},
    L4: {Outros:74424, Tanaia:41751, Josilene:25391},
    L5: {Outros:41129, Rosiene:29862, Joyce:24943},
  },
};

// Compara o total de um mês (individual ou loja inteira) com o mesmo mês do ano
// anterior. Retorna null se faltar dado de qualquer um dos dois lados (não dá
// pra comparar — não gera elogio nem conclusão nenhuma, fica silencioso).
function calcCrescimentoYoY(mesKeyAtual, lojaKey, vendedora) {
  const [anoStr, mm] = mesKeyAtual.split('-');
  const mesKeyAnterior = `${+anoStr - 1}-${mm}`;
  const atualLd = DADOS[mesKeyAtual]?.[lojaKey];
  const anteriorObj = HIST_MENSAL_YOY[mesKeyAnterior]?.[lojaKey];
  if (!atualLd || !anteriorObj) return null;

  const somaMes = (ld, vend) => (ld.semanas || []).reduce((s, sem) => {
    const v = (ld.vendas?.[sem.id] || {});
    return s + (vend ? (v[vend] || 0) : Object.values(v).reduce((a,x)=>a+(x||0),0));
  }, 0);

  const atual = vendedora ? somaMes(atualLd, vendedora) : somaMes(atualLd, null);
  const anterior = vendedora ? (anteriorObj[vendedora] || 0) : Object.values(anteriorObj).reduce((s,v)=>s+(v||0),0);
  if (anterior <= 0 || atual <= 0) return null;
  return {atual, anterior, variacaoPct: (atual - anterior) / anterior * 100, mesKeyAnterior};
}

// ─── MOTOR DE AVALIAÇÃO AUTOMÁTICA — GENERALIZADO (04/07/2026) ───────────────
// Antes disso, esta função era hardcoded pra maio/2026 (W19-W22) — sugestões de
// qualquer semana seguinte (W23 em diante, ~40 sugestões) NUNCA foram avaliadas
// automaticamente porque a função só sabia mapear 4 semanas específicas e
// calcAutoMetrics tinha `mesKey = '2026-05'` fixo. Ver [[premiacao_sugestoes_redesign]].
//
// ⚠️ Decisão revista no MESMO DIA (04/07/2026): a ideia original era valer só
// "daqui pra frente" (AUTO_AVALIACAO_DESDE=W28), sem tocar nas ~27 sugestões já
// aprovadas e nunca avaliadas (W22/W23/W25). O Athila pediu explicitamente pra
// avaliar ESSAS TAMBÉM com dado real (não opinião da vendedora) — "buscar dados
// que mostrem se deu certo ou não". Por isso a trava foi REMOVIDA: o motor agora
// roda pra qualquer semana ISO (exceto os casos especiais de maio, preservados).
// Não recongela nada (imutabilidade dos prêmios continua intacta) — só passa a
// AVALIAR objetivamente sugestões que nunca tinham veredito nenhum.

// Segunda-feira (Date, UTC) de uma semana ISO (ano, semana).
function _isoWeekParaData(ano, semana) {
  const simple = new Date(Date.UTC(ano, 0, 1 + (semana - 1) * 7));
  const dow = simple.getUTCDay() || 7;
  simple.setUTCDate(simple.getUTCDate() + 1 - dow);
  return simple;
}

// "01/07–04/07" OU "01/06 a 06/06" → {ini:Date, fim:Date} (UTC, ano informado).
function _parsePeriodo(periodo, ano) {
  if (!periodo) return null;
  const m = periodo.match(/(\d{2})\/(\d{2})\D+(\d{2})\/(\d{2})/);
  if (!m) return null;
  return {
    ini: new Date(Date.UTC(ano, +m[2]-1, +m[1])),
    fim: new Date(Date.UTC(ano, +m[4]-1, +m[3])),
  };
}

// Acha em qual {mesKey, semana} do DADOS a segunda-feira de uma semana ISO cai,
// e qual é a semana anterior (baseline). Lojas compartilham os mesmos períodos
// no mesmo mês, então L1 serve de referência pra achar o período.
function _acharSemanaPorIsoWeek(ano, semana) {
  const segunda = _isoWeekParaData(ano, semana);
  for (const mesKey of Object.keys(DADOS)) {
    const ld = DADOS[mesKey]?.L1;
    if (!ld || !ld.semanas) continue;
    const idx = ld.semanas.findIndex(s => {
      const per = _parsePeriodo(s.periodo, ano);
      return per && segunda >= per.ini && segunda <= per.fim;
    });
    if (idx >= 0) {
      return {mesKey, avaliada: ld.semanas[idx].id, baseline: idx > 0 ? ld.semanas[idx-1].id : null};
    }
  }
  return null;
}

// Da semana ISO da sug (ex '2026-W21'), descobre {mesKey, baseline, avaliada}.
//
// ⚠️ Casos especiais preservados (mai/2026) — App lançado quinta 21/05, no MEIO
// da S3. Antes do app vs depois do app é a comparação justa pras sugestões W21.
// Usa vendas_split.S3_pre (seg-qua 18-20/05) vs S3_pos (qui-sáb 21-23/05).
// Ver memória [[premiacao_metrica_antes_depois_app]]. W19/W20/W22 também fixas
// (mesma época, mesmo raciocínio S vs S-1 mas com IDs já conhecidos).
function _semIdsDaSugestao(idSug) {
  const especiais = {
    'W21': {mesKey:'2026-05', baseline:'S3_pre', avaliada:'S3_pos', label:'antes app (18-20/05) → depois app (21-23/05)'},
    'W22': {mesKey:'2026-05', baseline:'S3',     avaliada:'S4'},
    'W19': {mesKey:'2026-05', baseline:'',       avaliada:'S1'},
    'W20': {mesKey:'2026-05', baseline:'S1',     avaliada:'S2'},
  };
  const m = idSug.match(/^(\d{4})-W(\d+)-/);
  if (!m) return null;
  const ano = +m[1], semana = +m[2];
  const wKey = 'W' + String(semana).padStart(2,'0');
  if (especiais[wKey]) return especiais[wKey];

  return _acharSemanaPorIsoWeek(ano, semana);
}

function _getMA(ld, semId, vendOuLoja) {
  if (!ld || !semId) return null;
  // S3_pre/S3_pos: não temos MA% por sub-período (relatório só gera por semana inteira).
  // Retornar null → calcAutoMetrics marca como "não rastreável" pra essas sugestões.
  if (semId === 'S3_pre' || semId === 'S3_pos') return null;
  if (vendOuLoja === '__loja__') {
    return ld.marcasA_loja?.[semId] ?? null;
  }
  // por vendedora: só temos média do mês (marcasA_indiv) — não dá pra detalhar por semana
  // Usar como aproximação a média do mês (limitação documentada na UI)
  return ld.marcasA_indiv?.[vendOuLoja] ?? null;
}

// IDs especiais S3_pre/S3_pos vêm de ld.vendas_split (sub-períodos de S3)
function _getVendasPorId(ld, semId) {
  if (semId === 'S3_pre' || semId === 'S3_pos') {
    return ld?.vendas_split?.[semId] || {};
  }
  return ld?.vendas?.[semId] || {};
}

function _getVendasIndiv(ld, semId, vend) {
  return _getVendasPorId(ld, semId)[vend] ?? 0;
}

function _getVendasLoja(ld, semId) {
  const v = _getVendasPorId(ld, semId);
  return Object.values(v).reduce((s,x) => s+(x||0), 0);
}

function _getMetaSem(ld, semId) {
  // S3_pre/S3_pos: 3 dias cada → meta da semana ÷ 2 (aproximação)
  if (semId === 'S3_pre' || semId === 'S3_pos') {
    const metaS3 = (ld?.semanas||[]).find(s => s.id === 'S3')?.meta || 0;
    return Math.round(metaS3 / 2);
  }
  return (ld?.semanas||[]).find(s => s.id === semId)?.meta || 0;
}

// ticket_medio = vendas ÷ tickets (nº de vendas/atendimentos que fecharam).
// Dado já coletado toda semana (ld.tickets[semId]) mas nunca usado no motor
// automático — adicionado 04/07/2026 pra permitir avaliar sugestões de tipo
// ticket_medio com dado real em vez de depender só de avaliação manual.
function _getTicketsPorId(ld, semId) {
  return ld?.tickets?.[semId] || {};
}
function _getTicketsIndiv(ld, semId, vend) {
  return _getTicketsPorId(ld, semId)[vend] ?? 0;
}
function _getTicketsLoja(ld, semId) {
  return Object.values(_getTicketsPorId(ld, semId)).reduce((s,x)=>s+(x||0), 0);
}
// Ticket médio = R$ vendido ÷ nº de tickets. null se não há tickets (não dá pra dividir).
function _getTicketMedio(ld, semId, vend) {
  const vendas = vend ? _getVendasIndiv(ld, semId, vend) : _getVendasLoja(ld, semId);
  const tickets = vend ? _getTicketsIndiv(ld, semId, vend) : _getTicketsLoja(ld, semId);
  if (!tickets) return null;
  return vendas / tickets;
}

function calcAutoMetrics(sug) {
  if (!sug || !sug.meta_alvo) return null;
  // ⚠️ O ALVO QUE VOCÊ APROVOU MANDA — não o rascunho do HTML. Se o override
  // (o que o Athila editou/aprovou no painel) traz alvo_semana/meta_valor/meta_alvo,
  // eles têm prioridade sobre os campos crus da sugestão. Sem isso, a avaliação
  // media contra o meu rascunho e ignorava a edição (Athila, 27/07/2026).
  try {
    const o = (typeof loadSugestoesOverrides === 'function') ? loadSugestoesOverrides()[sug.id] : null;
    if (o && (o.alvo_semana != null || o.meta_valor != null || o.meta_alvo)) {
      sug = { ...sug };
      if (o.alvo_semana != null && o.alvo_semana !== '') sug.alvo_semana = +o.alvo_semana;
      if (o.meta_valor != null && o.meta_valor !== '') sug.meta_valor = +o.meta_valor;
      if (o.meta_alvo) sug.meta_alvo = o.meta_alvo;
    }
  } catch (_) {}
  if (!['vendas_individuais','atingir_meta','marcas_a','ticket_medio','venda_marca','meta_mensal_individual','corrida_mensal'].includes(sug.meta_alvo)) {
    return {tipo:'nao_rastreavel', meta_alvo:sug.meta_alvo};
  }
  const ids = _semIdsDaSugestao(sug.id);
  if (!ids) return null;
  const mesKey = ids.mesKey; // derivado de _semIdsDaSugestao (generalizado 04/07/2026)
  const ld = DADOS[mesKey]?.[sug.loja];
  // corrida_mensal é da REDE (sem sug.loja) — varre todas as lojas lá embaixo.
  if (!ld && sug.meta_alvo !== 'corrida_mensal') return null;

  const th = sug.threshold || DEFAULT_THRESHOLDS[sug.meta_alvo];
  let baseline = null, resultado = null, status = null, deltaStr = '', unidade = '';
  let ctxTM = null; // contexto extra do ticket médio (clientes/vendas) — ver branch abaixo
  let ctxSem = null; // metas das duas semanas comparadas (baseline deflacionada)
  let ctxMes = null; // ritmo rumo à meta mensal individual — ver meta_mensal_individual
  let ctxAbs = null; // alvo semanal absoluto (R$ ou unidades) — ver alvo_semana

  if (sug.meta_alvo === 'vendas_individuais') {
    if (!sug.vendedora) return null;
    baseline = _getVendasIndiv(ld, ids.baseline, sug.vendedora);
    resultado = _getVendasIndiv(ld, ids.avaliada, sug.vendedora);
    unidade = 'R$';
    // ── ALVO SEMANAL ABSOLUTO ────────────────────────────────────────────────
    // Quando a sugestão fixou um número da semana ("R$11.000 essa semana"), o que
    // vale é se ela BATEU esse número — não o delta vs a semana anterior. A W30
    // (semana S4) foi montada assim. Athila, 27/07/2026.
    if (sug.alvo_semana) {
      const pct = sug.alvo_semana > 0 && resultado > 0 ? resultado / sug.alvo_semana * 100 : 0;
      baseline = sug.alvo_semana;
      if (resultado > 0) {
        deltaStr = pct.toFixed(0) + '% do alvo';
        if (pct >= 100) status = 'funcionou';
        else if (pct >= 85) status = 'parcial';
        else status = 'nao_funcionou';
      } else { status = null; }
      ctxAbs = {alvo: sug.alvo_semana, feito: resultado, pct};
      return {tipo:'calculado', meta_alvo:sug.meta_alvo, baseline, resultado, status,
        deltaStr, unidade, threshold:th, sem_baseline:ids.baseline, sem_avaliada:ids.avaliada,
        ctxTM, ctxSem, ctxMes, ctxAbs};
    }
    // ⚠️ AS SEMANAS NÃO TÊM O MESMO TAMANHO. A meta semanal é redistribuída todo
    // mês, então uma semana pode valer 16% menos que a anterior (L1: S2 34.000 →
    // S3 28.507). Comparar R$ cru contra a semana passada cobra da vendedora um
    // crescimento que o próprio planejamento não pediu — a Rayra fez 116% da meta
    // da S3 e o motor carimbava "✗ não funcionou" (Athila, 21/07/2026).
    // Correção: deflacionar a baseline pela razão entre as metas antes de comparar.
    const metaBase = _getMetaSem(ld, ids.baseline);
    const metaAval = _getMetaSem(ld, ids.avaliada);
    const fatorSem = (metaBase > 0 && metaAval > 0) ? metaAval / metaBase : 1;
    const baselineAjust = baseline * fatorSem;
    if (baselineAjust > 0 && resultado > 0) {
      const variacao = (resultado - baselineAjust) / baselineAjust * 100;
      deltaStr = (variacao >= 0 ? '+' : '') + variacao.toFixed(0) + '%';
      if (variacao >= th.funcionou) status = 'funcionou';
      else if (variacao >= th.parcial) status = 'parcial';
      else status = 'nao_funcionou';
    } else if (resultado === 0 || resultado === null) {
      status = null; // semana ainda não fechou
    }
    ctxSem = {meta_base: metaBase, meta_aval: metaAval, fator: fatorSem, baseline_ajustada: baselineAjust};
  }
  else if (sug.meta_alvo === 'corrida_mensal') {
    // Sugestão da REDE ("Corrida dos R$31.000"): não tem vendedora, então o que
    // se mede é quantas estão no ritmo — a foto que o delta semanal escondia.
    // Athila, 21/07/2026: "pode fazer a avaliação da corrida dessa forma".
    const alvoMes = sug.meta_valor || FAIXAS_PREMIO_INDIVIDUAL[0].valor;
    const linhas = [];
    for (const L of Object.keys(LOJAS_BASE)) {
      const l = DADOS[mesKey]?.[L];
      if (!l) continue;
      const frac = _fracaoPlanoAte(l, ids.avaliada);
      if (!frac) continue;
      for (const v of (LOJAS_BASE[L].vendedoras || [])) {
        const acum = _acumIndivAte(l, ids.avaliada, v);
        if (!acum) continue;   // sem venda no mês → fora do quadro (afastada, nova...)
        linhas.push({loja: L, vend: v, acum, ritmo: acum / (alvoMes * frac) * 100,
                     projecao: acum / frac});
      }
    }
    if (!linhas.length) return null;
    const bateram  = linhas.filter(x => x.acum >= alvoMes).length;
    const noRitmo  = linhas.filter(x => x.ritmo >= 100).length;
    const projetam = linhas.filter(x => x.projecao >= alvoMes).length;
    const pct = noRitmo / linhas.length * 100;
    baseline = linhas.length;
    resultado = noRitmo;
    unidade = 'vendedoras';
    deltaStr = `${noRitmo} de ${linhas.length} no ritmo`;
    if (pct >= th.funcionou) status = 'funcionou';
    else if (pct >= th.parcial) status = 'parcial';
    else status = 'nao_funcionou';
    ctxMes = {
      alvo_mes: alvoMes, total: linhas.length, bateram, no_ritmo: noRitmo, projetam,
      por_loja: Object.keys(LOJAS_BASE).map(L => {
        const t = linhas.filter(x => x.loja === L);
        return {loja: L, total: t.length, no_ritmo: t.filter(x => x.ritmo >= 100).length};
      }).filter(x => x.total),
      lista: linhas.sort((a, b) => b.ritmo - a.ritmo),
    };
  }
  else if (sug.meta_alvo === 'meta_mensal_individual') {
    // A promessa da sugestão é um número do MÊS (R$31.000 pro prêmio individual,
    // R$40.000 pra faixa de R$300...). O que se avalia é o RITMO: o acumulado até
    // aqui vs o que deveria ter sido feito a esta altura do plano mensal.
    if (!sug.vendedora) return null;
    const alvoMes = sug.meta_valor || 31000;
    const acum = _acumIndivAte(ld, ids.avaliada, sug.vendedora);
    const frac = _fracaoPlanoAte(ld, ids.avaliada);
    if (acum === null || !frac) return null;
    const esperado = alvoMes * frac;
    const semanaRS = _getVendasIndiv(ld, ids.avaliada, sug.vendedora);
    if (!semanaRS) { status = null; }  // semana ainda não fechou
    else {
      const ritmo = esperado > 0 ? acum / esperado * 100 : 0;
      baseline = esperado;
      resultado = acum;
      unidade = 'R$';
      deltaStr = ritmo.toFixed(0) + '% do ritmo';
      if (acum >= alvoMes) status = 'funcionou';           // já garantiu o objetivo
      else if (ritmo >= th.funcionou) status = 'funcionou';
      else if (ritmo >= th.parcial) status = 'parcial';
      else status = 'nao_funcionou';
      // Várias sugestões trazem TAMBÉM um pedido explícito da semana
      // ("Meta essa semana: R$10.000"). Se ela cumpriu o que foi pedido, isso
      // não pode virar "✗ não funcionou" só porque o mês inteiro está atrasado —
      // ela entregou exatamente o combinado. Vira parcial, no mínimo.
      const pedidoSem = sug.meta_semana_valor || null;
      const pctSem = pedidoSem ? semanaRS / pedidoSem * 100 : null;
      if (pctSem !== null && pctSem >= 100 && status === 'nao_funcionou') status = 'parcial';
      ctxMes = {
        alvo_mes: alvoMes, acumulado: acum, esperado, ritmo,
        frac_plano: frac, projecao: frac > 0 ? acum / frac : null,
        semana_rs: semanaRS, pedido_semana: pedidoSem, pct_semana: pctSem,
        falta: Math.max(0, alvoMes - acum),
        serie: _serieSemanalIndiv(ld, sug.vendedora, ids.avaliada),
        total_hoje: _totalMesAtual(ld, sug.vendedora),
        // faixa mais alta JÁ garantida (null se ainda não chegou na primeira) e
        // a faixa que a sugestão pediu — a mensagem mostra as duas distâncias.
        faixa_conquistada: [...FAIXAS_PREMIO_INDIVIDUAL].reverse().find(f => acum >= f.valor) || null,
        faixa_alvo: FAIXAS_PREMIO_INDIVIDUAL.find(f => f.valor === alvoMes) || null,
        prox_faixa: _proxFaixa(Math.max(acum, alvoMes)),
        base_31k: FAIXAS_PREMIO_INDIVIDUAL[0].valor,
        falta_31k: Math.max(0, FAIXAS_PREMIO_INDIVIDUAL[0].valor - acum),
        semanas_restantes: (() => {
          const sems = (ld.semanas || []).filter(Boolean);
          const i = sems.findIndex(s => s.id === ids.avaliada);
          return i < 0 ? 0 : sems.length - 1 - i;
        })(),
      };
    }
  }
  else if (sug.meta_alvo === 'atingir_meta') {
    if (sug.escopo === 'vendedora') {
      // Pra vendedora: bateu meta semanal proporcional dela? simplificado: usar % loja
      // (a vendedora não tem meta individual no schema)
    }
    // ⚠️ Caso especial W21 (S3_pre vs S3_pos): comparar VOLUMES, não % da meta
    // (a meta da semana é única — não faz sentido pedir 100% em meio período).
    // Compara crescimento de R$: se vendido_pos ≥ vendido_pre * (1 + threshold/100), funcionou.
    if (ids.baseline === 'S3_pre') {
      const vendidoPre = _getVendasLoja(ld, ids.baseline);
      const vendidoPos = _getVendasLoja(ld, ids.avaliada);
      baseline = vendidoPre;
      resultado = vendidoPos;
      unidade = 'R$';
      if (vendidoPre > 0 && vendidoPos > 0) {
        const variacao = (vendidoPos - vendidoPre) / vendidoPre * 100;
        deltaStr = (variacao >= 0 ? '+' : '') + variacao.toFixed(0) + '% vs antes do app';
        // Reaproveita thresholds de vendas_individuais (15% / 5%)
        const thr = DEFAULT_THRESHOLDS.vendas_individuais;
        if (variacao >= thr.funcionou) status = 'funcionou';
        else if (variacao >= thr.parcial) status = 'parcial';
        else status = 'nao_funcionou';
      }
    } else {
      const vendido = _getVendasLoja(ld, ids.avaliada);
      const meta = _getMetaSem(ld, ids.avaliada);
      baseline = meta;
      resultado = vendido;
      unidade = 'R$';
      if (meta > 0 && vendido > 0) {
        const pctBatido = vendido / meta * 100;
        deltaStr = pctBatido.toFixed(0) + '% da meta';
        if (pctBatido >= th.funcionou) status = 'funcionou';
        else if (pctBatido >= th.parcial) status = 'parcial';
        else status = 'nao_funcionou';
      }
    }
  }
  else if (sug.meta_alvo === 'marcas_a') {
    const alvo = sug.escopo === 'vendedora' && sug.vendedora ? sug.vendedora : '__loja__';
    if (alvo === '__loja__') {
      baseline = _getMA(ld, ids.baseline, '__loja__');
      resultado = _getMA(ld, ids.avaliada, '__loja__');
    } else {
      // Vendedora: marcasA_indiv é média do mês — não tem versão por semana.
      // Usar como aproximação único valor disponível.
      baseline = _getMA(ld, null, alvo);
      resultado = _getMA(ld, null, alvo);
      return {tipo:'estimativa_individual', meta_alvo:'marcas_a', vendedora:sug.vendedora, valor_medio_mes:baseline};
    }
    unidade = '%';
    // ── PISO ABSOLUTO ("manter ≥30%") ────────────────────────────────────────
    // Sugestão de MANTER um nível não deve ser avaliada por delta: cair de 33,9%
    // pra 30,0% e continuar acima do piso do bônus (30%) é SUCESSO, não fracasso
    // (caso L4, W30). Quando a sugestão traz alvo_semana (o piso em pp), avaliar
    // pelo nível atingido, não pela variação.
    if (sug.alvo_semana && resultado !== null) {
      const pctPiso = resultado / sug.alvo_semana * 100;
      deltaStr = resultado.toFixed(1) + '% (piso ' + sug.alvo_semana + '%)';
      if (pctPiso >= 100) status = 'funcionou';
      else if (pctPiso >= 90) status = 'parcial';
      else status = 'nao_funcionou';
      ctxAbs = {alvo: sug.alvo_semana, feito: resultado, pct: pctPiso, piso: true};
      return {tipo:'calculado', meta_alvo:sug.meta_alvo, baseline, resultado, status,
        deltaStr, unidade, threshold:th, sem_baseline:ids.baseline, sem_avaliada:ids.avaliada,
        ctxTM, ctxSem, ctxMes, ctxAbs};
    }
    if (baseline !== null && resultado !== null) {
      const deltaPP = resultado - baseline;
      deltaStr = (deltaPP >= 0 ? '+' : '') + deltaPP.toFixed(1) + 'pp';
      if (deltaPP >= th.funcionou) status = 'funcionou';
      else if (deltaPP >= th.parcial) status = 'parcial';
      else status = 'nao_funcionou';
    }
  }
  else if (sug.meta_alvo === 'ticket_medio') {
    // ticket_medio = R$ vendido ÷ nº de tickets fechados. Adicionado 04/07/2026
    // (antes dependia 100% de avaliação manual — o dado (ld.tickets) já existia
    // coletado toda semana, só não era usado no motor automático).
    const alvo = sug.escopo === 'vendedora' && sug.vendedora ? sug.vendedora : null;
    baseline = _getTicketMedio(ld, ids.baseline, alvo);
    resultado = _getTicketMedio(ld, ids.avaliada, alvo);
    unidade = 'R$';
    // Ticket médio é uma DIVISÃO — ele cai tanto quando se vende pior quanto
    // quando se atende muito mais gente. Sem o numerador e o denominador
    // separados, um "-27%" pode ser lido como fracasso quando na verdade a
    // pessoa cresceu em vendas (caso Brunna S1→S2 jul/2026). Guardamos os dois
    // pra mensagem de retorno poder contar a história inteira.
    ctxTM = {
      clientes_base: alvo ? _getTicketsIndiv(ld, ids.baseline, alvo) : _getTicketsLoja(ld, ids.baseline),
      clientes_aval: alvo ? _getTicketsIndiv(ld, ids.avaliada, alvo) : _getTicketsLoja(ld, ids.avaliada),
      vendas_base:   alvo ? _getVendasIndiv(ld, ids.baseline, alvo) : _getVendasLoja(ld, ids.baseline),
      vendas_aval:   alvo ? _getVendasIndiv(ld, ids.avaliada, alvo) : _getVendasLoja(ld, ids.avaliada),
    };
    if (baseline !== null && resultado !== null && baseline > 0) {
      const variacao = (resultado - baseline) / baseline * 100;
      deltaStr = (variacao >= 0 ? '+' : '') + variacao.toFixed(0) + '%';
      if (variacao >= th.funcionou) status = 'funcionou';
      else if (variacao >= th.parcial) status = 'parcial';
      else status = 'nao_funcionou';
    }
  }
  else if (sug.meta_alvo === 'venda_marca') {
    // Sugestões concretas por marca (pedido do Athila, 04/07/2026): "aumentar a
    // venda de marca X essa semana". Compara UNIDADES vendidas da marca na semana
    // anterior (baseline) vs a semana da sugestão (avaliada). Fonte:
    // DADOS[mes][loja].vendas_marca[Sx][marca], coletada via
    // coleta_vendas_marca_semana.mjs (ver SKILL.md seção 5.5). Requer sug.marca.
    if (!sug.marca) return {tipo:'nao_rastreavel', meta_alvo:sug.meta_alvo};
    const vm = ld.vendas_marca || {};
    resultado = (vm[ids.avaliada] || {})[sug.marca] ?? null;
    unidade = 'un';
    // ── ALVO ABSOLUTO DE UNIDADES ────────────────────────────────────────────
    // Igual às individuais: quando a sugestão fixa "meta: 150 unidades", avaliar
    // se bateu, não o delta. A W30 (S4) foi montada com metas absolutas de marca.
    if (sug.alvo_semana) {
      if (resultado === null) return {tipo:'nao_rastreavel', meta_alvo:sug.meta_alvo, motivo:'vendas_marca_nao_coletadas'};
      const pct = sug.alvo_semana > 0 ? resultado / sug.alvo_semana * 100 : 0;
      baseline = sug.alvo_semana;
      deltaStr = pct.toFixed(0) + '% do alvo';
      if (pct >= 100) status = 'funcionou';
      else if (pct >= 85) status = 'parcial';
      else status = 'nao_funcionou';
      ctxAbs = {alvo: sug.alvo_semana, feito: resultado, pct};
      return {tipo:'calculado', meta_alvo:sug.meta_alvo, baseline, resultado, status,
        deltaStr, unidade, threshold:th, sem_baseline:ids.baseline, sem_avaliada:ids.avaliada,
        ctxTM, ctxSem, ctxMes, ctxAbs};
    }
    baseline = (vm[ids.baseline] || {})[sug.marca] ?? null;
    if (baseline !== null && resultado !== null && baseline > 0) {
      const variacao = (resultado - baseline) / baseline * 100;
      deltaStr = (variacao >= 0 ? '+' : '') + variacao.toFixed(0) + '%';
      if (variacao >= th.funcionou) status = 'funcionou';
      else if (variacao >= th.parcial) status = 'parcial';
      else status = 'nao_funcionou';
    } else if (baseline === null || resultado === null) {
      // Ainda não coletado (coleta_vendas_marca_semana.mjs não rodou pra essa marca/semana)
      return {tipo:'nao_rastreavel', meta_alvo:sug.meta_alvo, motivo:'vendas_marca_nao_coletadas'};
    }
  }

  return {
    tipo:'calculado',
    meta_alvo: sug.meta_alvo,
    baseline, resultado, status, deltaStr, unidade,
    threshold: th,
    sem_baseline: ids.baseline,
    sem_avaliada: ids.avaliada,
    ctxTM, ctxSem, ctxMes,
  };
}

// Gera mensagem pronta de feedback pra enviar pra vendedora/equipe via WhatsApp.
// Personaliza por: meta_alvo, status (funcionou/parcial/nao), escopo (vendedora/loja),
// delta absoluto. Retorna string ou null se não há mensagem aplicável.
function gerarMensagemFeedback(sug, m) {
  if (!m || m.tipo !== 'calculado' || m.status === null) return null;
  const nome = sug.vendedora ? sug.vendedora.split(' ')[0] : null;
  const fmtR = (v) => 'R$ ' + Math.round(v||0).toLocaleString('pt-BR');
  const isWeekendComparison = m.sem_baseline === 'S3_pre';

  // Corrida dos R$31.000 — sugestão da REDE. O retorno é a foto do grupo:
  // quantas já garantiram, quantas estão no ritmo e onde a corrida está travando.
  if (sug.meta_alvo === 'corrida_mensal') {
    const c = m.ctxMes || {};
    const porLoja = (c.por_loja || [])
      .map(x => `${LOJAS_BASE[x.loja]?.nome || x.loja}: ${x.no_ritmo}/${x.total}`)
      .join(' · ');
    // Só quem REALMENTE cruzou a linha entra na lista de garantidas — listar os
    // 3 melhores por ritmo colocava quem ainda não bateu junto de quem bateu.
    const garantidas = (c.lista || []).filter(x => x.acum >= c.alvo_mes)
      .map(x => `${x.vend.split(' ')[0]} (${fmtR(x.acum)})`).join(', ');
    const quaseLa = (c.lista || []).filter(x => x.acum < c.alvo_mes && x.projecao >= c.alvo_mes)
      .slice(0, 3).map(x => x.vend.split(' ')[0]).join(', ');
    const abertura = c.bateram > 0
      ? `${c.bateram === 1 ? 'Uma já garantiu' : c.bateram + ' já garantiram'} os ${fmtR(c.alvo_mes)}: ${garantidas}. ` +
        (quaseLa ? `${quaseLa} logo atrás. ` : '')
      : `Ninguém fechou os ${fmtR(c.alvo_mes)} ainda. `;
    const meio = `${c.no_ritmo}/${c.total} no ritmo. Por loja: ${porLoja}.`;
    if (m.status === 'funcionou') {
      return `Time! ${abertura}${meio} A maioria no jogo — quem falta, dá tempo. ` +
        `Marca A pra todo cliente é o que mais move o número. 💪`;
    }
    if (m.status === 'parcial') {
      return `Time! ${abertura}${meio} Quem está na frente oferece Marca A logo de cara e fecha combo de 3. ` +
        `Vamos espalhar isso essa semana. 👊`;
    }
    return `Time, com franqueza: ${abertura}${meio} A maioria fora do ritmo não é esforço, é método — ` +
      `vou sentar loja por loja pra destravar (fluxo, escala, estoque ou abordagem).`;
  }

  // Sugestão de objetivo MENSAL ("chegar nos R$31.000"). O feedback tem que
  // responder à corrida do mês, não ao sobe-desce da semana — e sempre terminar
  // num número acionável: quanto falta por semana daqui pra frente.
  if (sug.meta_alvo === 'meta_mensal_individual' && nome) {
    const c = m.ctxMes || {};
    const porSem = c.semanas_restantes > 0 ? c.falta / c.semanas_restantes : c.falta;
    const s0 = c.serie;              // série de semanas fechadas dela (mediana/máximo)
    const agora = c.total_hoje && c.total_hoje > c.acumulado ? c.total_hoje : c.acumulado;
    // As DUAS distâncias — pros R$31.000 (prêmio base) e pra faixa mais alta que
    // ela mira (pedido do Athila, 21/07). Uma linha só.
    const duasFaltas = (!c.faixa_conquistada && c.alvo_mes > c.base_31k)
      ? `Faltam ${fmtR(c.falta_31k)} pros ${fmtR(c.base_31k)} e ${fmtR(c.falta)} pros ${fmtR(c.alvo_mes)}${c.faixa_alvo ? ` (${fmtR(c.faixa_alvo.premio)})` : ''}.`
      : `Faltam ${fmtR(c.falta)}.`;
    const recTxt = s0 && s0.maximo ? ` (já fez ${fmtR(s0.maximo)} numa)` : '';

    // Mensagens CURTAS e diretas (Athila, 22/07/2026). Régua = faixa do prêmio e
    // recorde dela, nunca "o esperado era X" (isso comunica que se pedia pouco).

    if (c.acumulado >= c.alvo_mes) {
      const proxima = c.prox_faixa
        ? ` Próxima faixa: ${fmtR(c.prox_faixa.valor)} (${fmtR(c.prox_faixa.premio)}), faltam ${fmtR(c.prox_faixa.valor - c.acumulado)}.`
        : '';
      return `${nome}, conseguiu! ${fmtR(agora)} no mês, prêmio garantido 🎉${proxima} Parabéns!`;
    }
    if (m.status === 'funcionou') {
      return `${nome}, ${fmtR(agora)} no mês, indo muito bem 💪 No seu ritmo fecha em ${fmtR(c.projecao)}. ${duasFaltas} ` +
        `São ${fmtR(porSem)}/semana — você é uma das que mais vende, bora ver até onde dá.`;
    }
    // Teste de realidade: se o "por semana" for maior que o recorde dela, não
    // prometer o alvo do mês — trocar por um alvo semanal que ela alcança (lição
    // do caso Brunna, 15/07 + baseline_justa.mjs).
    const s = s0;
    const viavel = !s || !s.maximo ? true : porSem <= s.maximo;

    if (m.status === 'parcial' && viavel) {
      return `${nome}, ${fmtR(agora)} no mês. ${duasFaltas} São ${fmtR(porSem)}/semana${recTxt} — dá pra buscar. ` +
        `Oferece Marca A logo de cara e fecha combo de 3. 👊`;
    }
    if (!viavel) {
      const alvoReal = Math.round((s.maximo * 1.1) / 50) * 50;   // +10% sobre o recorde dela
      const fecharia = c.acumulado + alvoReal * c.semanas_restantes;
      return `${nome}, vou ser sincero: os ${fmtR(c.alvo_mes)} pedem ${fmtR(porSem)}/semana e seu recorde é ${fmtR(s.maximo)}. ` +
        `Não quero te cobrar conta que não fecha. Teu alvo é ${fmtR(alvoReal)}/semana → mês em ${fmtR(fecharia)}, teu melhor. ` +
        `Me diz como te ajudo.`;
    }
    // fora do ritmo, mas ainda ao alcance dela
    return `${nome}, vamos com franqueza: ${fmtR(agora)} no mês, nesse passo fecha em ${fmtR(c.projecao)} (abaixo dos ${fmtR(c.alvo_mes)}). ` +
      `São ${fmtR(porSem)}/semana${recTxt} — dá. Vamos sentar pra ver o que travou.`;
  }

  if (sug.meta_alvo === 'vendas_individuais' && nome && m.ctxAbs) {
    // Alvo semanal absoluto ("R$11.000 essa semana"): a mensagem fala do número
    // pedido, curto e direto (Athila, 27/07).
    const a = m.ctxAbs;
    if (m.status === 'funcionou') {
      return `${nome}, alvo da semana era ${fmtR(a.alvo)} e você fez ${fmtR(a.feito)} (${a.pct.toFixed(0)}%) 👏 Mandou bem!`;
    }
    if (m.status === 'parcial') {
      return `${nome}, alvo da semana era ${fmtR(a.alvo)}, você fez ${fmtR(a.feito)} (${a.pct.toFixed(0)}%). ` +
        `Chegou pertinho — semana que vem fecha. 👊`;
    }
    return `${nome}, o alvo era ${fmtR(a.alvo)} e a semana fechou em ${fmtR(a.feito)} (${a.pct.toFixed(0)}%). ` +
      `Vamos ver juntos o que atrapalhou — semana nova, novo alvo.`;
  }

  if (sug.meta_alvo === 'vendas_individuais' && nome) {
    // A comparação é contra a semana anterior JÁ DEFLACIONADA pelo tamanho da
    // semana (ver ctxSem em calcAutoMetrics). Quando as metas mudaram de tamanho,
    // dizer só "R$12.029 → R$11.301" faz a pessoa achar que caiu, quando na
    // verdade ela cresceu em relação ao que foi pedido. Então explicitamos.
    const cs = m.ctxSem || {};
    const encolheu = cs.fator && Math.abs(1 - cs.fator) >= 0.03;
    const notaSem = encolheu
      ? ` (a meta da semana mudou de ${fmtR(cs.meta_base)} pra ${fmtR(cs.meta_aval)}, ` +
        `então a comparação justa com a semana passada é ${fmtR(cs.baseline_ajustada)} → ${fmtR(m.resultado)})`
      : ` (${fmtR(m.baseline)} → ${fmtR(m.resultado)})`;

    if (m.status === 'funcionou') {
      return `${nome}, suas vendas cresceram ${m.deltaStr}${notaSem} 👏 Continua nessa pegada!`;
    }
    if (m.status === 'parcial') {
      return `${nome}, suas vendas subiram ${m.deltaStr} essa semana${notaSem}. Tá no caminho — ` +
        `pra subir mais, oferece Marca A logo na primeira sugestão. 👊`;
    }
    // não funcionou
    return `${nome}, essa semana as vendas ficaram em ${m.deltaStr}${notaSem}. ` +
      `Vamos sentar pra ver o que travou — semana nova, jogo novo.`;
  }

  if (sug.meta_alvo === 'atingir_meta' && isWeekendComparison) {
    const lojaLabel = LOJAS_BASE[sug.loja]?.nome || sug.loja;
    if (m.status === 'funcionou') {
      return `Equipe da ${lojaLabel}: o final da semana fechou com crescimento de ` +
        `${m.deltaStr.replace(' vs antes do app','')} comparado ao início da semana ` +
        `(${fmtR(m.baseline)} → ${fmtR(m.resultado)}). Vocês reagiram juntas — ` +
        `vamos manter esse ritmo na próxima!`;
    }
    if (m.status === 'parcial') {
      return `Equipe da ${lojaLabel}: o final da semana ficou ${m.deltaStr.replace(' vs antes do app','')} ` +
        `vs o início (${fmtR(m.baseline)} → ${fmtR(m.resultado)}). Crescemos, mas dá pra mais — ` +
        `na próxima semana foco em oferecer Marca A pra todo cliente novo já no primeiro contato.`;
    }
    return `Equipe da ${lojaLabel}: o final da semana ficou ${m.deltaStr.replace(' vs antes do app','')} ` +
      `(${fmtR(m.baseline)} → ${fmtR(m.resultado)}). Vamos conversar na reunião de segunda ` +
      `pra entender o que travou — e ajustar a abordagem.`;
  }

  // atingir_meta normal (loja bateu a meta da SEMANA). baseline=meta, resultado=vendido.
  if (sug.meta_alvo === 'atingir_meta') {
    const lojaLabel = LOJAS_BASE[sug.loja]?.nome || sug.loja;
    if (m.status === 'funcionou') {
      return `Equipe ${lojaLabel}: bateram a meta da semana — ${fmtR(m.resultado)} de ${fmtR(m.baseline)} (${m.deltaStr}) 👏 Semana redonda!`;
    }
    if (m.status === 'parcial') {
      return `Equipe ${lojaLabel}: ${fmtR(m.resultado)} de ${fmtR(m.baseline)} (${m.deltaStr}). ` +
        `Faltou pouco — Marca A pra todo cliente e combo de 3 fecham essa diferença. 👊`;
    }
    return `Equipe ${lojaLabel}: ${fmtR(m.resultado)} de ${fmtR(m.baseline)} (${m.deltaStr}). ` +
      `Vamos conversar pra destravar — alinhamento de manhã e acompanhar o acumulado no caixa toda tarde.`;
  }

  if (sug.meta_alvo === 'marcas_a' && sug.escopo === 'loja') {
    const lojaLabel = LOJAS_BASE[sug.loja]?.nome || sug.loja;
    // Piso absoluto ("manter ≥30%"): fala do nível, não da variação.
    if (m.ctxAbs && m.ctxAbs.piso) {
      const a = m.ctxAbs;
      if (m.status === 'funcionou') {
        return `Equipe ${lojaLabel}: seguraram Marcas A em ${a.feito.toFixed(1)}% (piso ${a.alvo}%) 👏 Bônus de R$50 garantido — é manter!`;
      }
      if (m.status === 'parcial') {
        return `Equipe ${lojaLabel}: Marcas A em ${a.feito.toFixed(1)}%, quase no piso de ${a.alvo}%. ` +
          `Falta pouco pro bônus — Marca A na primeira oferta. 👊`;
      }
      return `Equipe ${lojaLabel}: Marcas A caíram pra ${a.feito.toFixed(1)}% (piso era ${a.alvo}%). ` +
        `Perdemos o bônus de R$50 — mesa de Marca A na entrada e oferecer pra todo cliente.`;
    }
    if (m.status === 'funcionou') {
      return `Equipe ${lojaLabel}: Marcas A subiu ${m.deltaStr} (${m.baseline?.toFixed(1)}% → ${m.resultado?.toFixed(1)}%) 👏 Continua oferecendo Marca A primeiro!`;
    }
    if (m.status === 'parcial') {
      return `Equipe ${lojaLabel}: Marcas A subiu ${m.deltaStr} (${m.baseline?.toFixed(1)}% → ${m.resultado?.toFixed(1)}%). ` +
        `Pros 30% e +R$50 no prêmio, caprichem no combo de 3. 👊`;
    }
    return `Equipe ${lojaLabel}: Marcas A em ${m.resultado?.toFixed(1)}% (era ${m.baseline?.toFixed(1)}%). ` +
      `Vamos virar isso: mesa de Marcas A na entrada e oferecer pra todo cliente.`;
  }

  // Ticket médio. NÃO existia mensagem pra este alvo (o motor calculava o -27% e
  // devolvia null), então o card saía com o carimbo vermelho e a caixa VAZIA —
  // "não funcionou" sem uma linha de explicação. Athila, 15/07/2026: "apenas dizer
  // que não funcionou não é um feedback efetivo".
  // A regra aqui: ticket médio é vendas ÷ clientes. Antes de cobrar, olhar se o
  // denominador explodiu — quem atendeu o dobro de gente e caiu de ticket não
  // vendeu mal, vendeu MAIS. Nesse caso o reconhecimento vem primeiro e o combo
  // vira oportunidade quantificada em R$, não repreensão.
  if (sug.meta_alvo === 'ticket_medio') {
    const c = m.ctxTM || {};
    const alvoLabel = nome || `Equipe da ${LOJAS_BASE[sug.loja]?.nome || sug.loja}`;
    const temCtx = c.clientes_base > 0 && c.clientes_aval > 0;
    const dCli = temCtx ? (c.clientes_aval / c.clientes_base - 1) * 100 : null;
    const dVen = temCtx && c.vendas_base > 0 ? (c.vendas_aval / c.vendas_base - 1) * 100 : null;
    const pct = (v) => (v >= 0 ? '+' : '') + Math.round(v) + '%';

    if (m.status === 'funcionou') {
      return `${alvoLabel}, seu ticket médio subiu ${m.deltaStr} ` +
        `(${fmtR(m.baseline)} → ${fmtR(m.resultado)} por cliente)${temCtx ? `, atendendo ${c.clientes_aval} clientes` : ''}. ` +
        `Era exatamente isso: o combo funcionou. Cada cliente que entra está saindo com mais. Segue assim!`;
    }
    if (m.status === 'parcial') {
      return `${alvoLabel}, seu ticket médio subiu ${m.deltaStr} (${fmtR(m.baseline)} → ${fmtR(m.resultado)} por cliente). ` +
        `Subiu, mas menos que o alvo. Na próxima, tenta oferecer a máscara da mesma marca junto do shampoo — ` +
        `é a peça que mais sobe o valor sem o cliente sentir.`;
    }
    // Não bateu o alvo. Antes de cobrar: cresceu em vendas atendendo mais gente?
    if (temCtx && dVen !== null && dVen > 10 && dCli > dVen) {
      const potencial = Math.round(c.clientes_aval * m.baseline);
      return `${alvoLabel}, o número cru diz que seu ticket caiu ${m.deltaStr} ` +
        `(${fmtR(m.baseline)} → ${fmtR(m.resultado)} por cliente) — mas ele não conta a história toda, ` +
        `e a sua é boa: suas vendas cresceram ${pct(dVen)} (${fmtR(c.vendas_base)} → ${fmtR(c.vendas_aval)}) ` +
        `e você atendeu ${pct(dCli)} mais clientes (${c.clientes_base} → ${c.clientes_aval}). ` +
        `Você não vendeu pior, você vendeu pra MUITO mais gente — e isso tem valor. ` +
        `O ticket caiu porque o atendimento ficou mais rápido, não porque piorou. ` +
        `Onde está a oportunidade: se esses mesmos ${c.clientes_aval} clientes tivessem saído com ${fmtR(m.baseline)} ` +
        `(o seu próprio ticket de antes), a semana teria sido ${fmtR(potencial)} em vez de ${fmtR(c.vendas_aval)}. ` +
        `Mesma gente, mesmo esforço. O combo é isso: no cliente que já está na sua frente, ` +
        `oferecer o condicionador e a máscara da mesma marca do shampoo. Não precisa atender mais ninguém.`;
    }
    return `${alvoLabel}, seu ticket médio ficou em ${m.deltaStr} ` +
      `(${fmtR(m.baseline)} → ${fmtR(m.resultado)} por cliente)` +
      `${temCtx ? `, com ${c.clientes_aval} clientes atendidos` : ''}. ` +
      `Vamos olhar isso juntas: pode ser o tipo de cliente da semana ou a hora de oferecer o combo. ` +
      `O caminho é o mesmo — no cliente que já está na sua frente, oferecer o condicionador e a máscara ` +
      `da mesma marca do shampoo. Semana nova, começa do zero.`;
  }

  if (sug.meta_alvo === 'venda_marca' && sug.marca && m.ctxAbs) {
    // Alvo absoluto de unidades ("meta: 150 un de Santa Clara").
    const a = m.ctxAbs;
    const eqp = sug.escopo === 'vendedora' && nome ? nome : `Equipe ${LOJAS_BASE[sug.loja]?.nome || sug.loja}`;
    if (m.status === 'funcionou') {
      return `${eqp}: meta de ${a.alvo} un de ${sug.marca} e vocês fizeram ${a.feito} (${a.pct.toFixed(0)}%) 👏 Continuem oferecendo primeiro!`;
    }
    if (m.status === 'parcial') {
      return `${eqp}: meta de ${a.alvo} un de ${sug.marca}, saíram ${a.feito} (${a.pct.toFixed(0)}%). Quase — oferecer pra todo cliente novo. 👊`;
    }
    return `${eqp}: a meta era ${a.alvo} un de ${sug.marca} e saíram ${a.feito} (${a.pct.toFixed(0)}%). ` +
      `É marca A e vende — falta oferecer logo de cara. Bota em destaque no balcão.`;
  }

  if (sug.meta_alvo === 'venda_marca' && sug.marca) {
    // "Vocês acataram a sugestão da semana, o resultado: as vendas da marca X
    // cresceram Y% essa semana comparada com a anterior" — formato pedido pelo
    // Athila 04/07/2026. Vale pro escopo 'loja' (mensagem pra equipe toda).
    const alvoLabel = sug.escopo === 'vendedora' && nome ? nome : `Equipe da ${LOJAS_BASE[sug.loja]?.nome || sug.loja}`;
    const un = (v) => Math.round(v||0) + ' un';
    if (m.status === 'funcionou') {
      return `${alvoLabel}: ${sug.marca} cresceu ${m.deltaStr} (${un(m.baseline)} → ${un(m.resultado)}) 👏 Continuem oferecendo primeiro!`;
    }
    if (m.status === 'parcial') {
      return `${alvoLabel}: ${sug.marca} subiu ${m.deltaStr} (${un(m.baseline)} → ${un(m.resultado)}). ` +
        `Dá pra mais — oferecer pra todo cliente novo. 👊`;
    }
    return `${alvoLabel}: ${sug.marca} ficou em ${m.deltaStr} (${un(m.baseline)} → ${un(m.resultado)}). ` +
      `Vamos dar mais destaque no balcão e oferecer logo de cara.`;
  }

  return null;
}

function renderStatusObjetivo(sug) {
  const m = calcAutoMetrics(sug);
  if (!m) return '';
  if (m.tipo === 'nao_rastreavel') {
    return `<div style="margin-top:10px;padding:8px 10px;background:rgba(148,163,184,.08);border-radius:6px;font-size:11px;color:var(--muted)">
      ⚪ <b>${ALVO_LABELS[m.meta_alvo]||m.meta_alvo}</b> — métrica não rastreada automaticamente. Depende da avaliação manual abaixo.
    </div>`;
  }
  if (m.tipo === 'estimativa_individual') {
    return `<div style="margin-top:10px;padding:8px 10px;background:rgba(148,163,184,.08);border-radius:6px;font-size:11px;color:var(--muted)">
      📊 <b>Marcas A da ${m.vendedora}</b>: ${m.valor_medio_mes!=null?m.valor_medio_mes.toFixed(0)+'%':'—'} (média do mês — não temos histórico semanal por vendedora).
    </div>`;
  }
  // tipo calculado
  if (m.status === null) {
    return `<div style="margin-top:10px;padding:8px 10px;background:rgba(148,163,184,.08);border-radius:6px;font-size:11px;color:var(--muted)">
      ⏳ Aguardando dados da semana avaliada (${m.sem_avaliada}). Status objetivo aparece após semana fechar.
    </div>`;
  }
  const cor = m.status === 'funcionou' ? 'var(--green)' : m.status === 'parcial' ? 'var(--yellow)' : 'var(--red)';
  const emoji = m.status === 'funcionou' ? '🟢' : m.status === 'parcial' ? '🟡' : '🔴';
  const lbl = m.status === 'funcionou' ? 'FUNCIONOU' : m.status === 'parcial' ? 'PARCIAL' : 'NÃO FUNCIONOU';
  const fmtV = (v) => m.unidade === 'R$' ? 'R$ ' + Math.round(v||0).toLocaleString('pt-BR') : (v||0).toFixed(1) + '%';
  const msg = gerarMensagemFeedback(sug, m);
  const msgBloco = msg ? `
    <div style="margin-top:10px;padding-top:10px;border-top:1px dashed ${cor};font-size:11px">
      <div style="font-size:10px;font-weight:700;color:${cor};letter-spacing:.3px;margin-bottom:6px">💬 MENSAGEM PRONTA PRA ENVIAR</div>
      <div id="msg-fb-${sug.id}" style="background:rgba(15,23,42,.5);padding:8px 10px;border-radius:6px;color:#e2e8f0;line-height:1.5;font-size:12px">${msg.replace(/</g,'&lt;')}</div>
      <button class="sug-btn" style="background:rgba(99,102,241,.2);color:#a5b4fc;border-color:rgba(99,102,241,.5);font-size:11px;padding:5px 10px;margin-top:6px" onclick="copiarMensagemFb('${sug.id}', this)">📋 Copiar mensagem</button>
    </div>` : '';
  return `<div style="margin-top:10px;padding:10px 12px;border-radius:8px;background:${cor==='var(--green)'?'rgba(34,197,94,.08)':cor==='var(--yellow)'?'rgba(234,179,8,.08)':'rgba(239,68,68,.08)'};border-left:3px solid ${cor}">
    <div style="font-size:11px;font-weight:700;color:${cor};margin-bottom:6px">${emoji} STATUS OBJETIVO: ${lbl}</div>
    <div style="font-size:12px;color:var(--text)">
      <b>${ALVO_LABELS[m.meta_alvo]}</b>:
      ${m.sem_baseline} = ${fmtV(m.baseline)} → ${m.sem_avaliada} = ${fmtV(m.resultado)}
      <span style="color:${cor};font-weight:700">(${m.deltaStr})</span>
    </div>
    <div style="font-size:10px;color:var(--muted);margin-top:4px">
      Critério: ≥${m.threshold.funcionou}${m.threshold.tipo==='absoluto_pp'?'pp':m.threshold.tipo==='meta_pct'?'%':'%'} = funcionou · ≥${m.threshold.parcial}${m.threshold.tipo==='absoluto_pp'?'pp':'%'} = parcial · &lt; = não funcionou
    </div>
    ${msgBloco}
  </div>`;
}

function copiarMensagemFb(idSug, btn) {
  const el = document.getElementById('msg-fb-' + idSug);
  if (!el) return;
  const txt = el.innerText;
  navigator.clipboard.writeText(txt).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ Copiado!';
    btn.style.background = 'rgba(34,197,94,.2)';
    btn.style.color = 'var(--green)';
    setTimeout(() => { btn.innerHTML = orig; btn.style.background = ''; btn.style.color = ''; }, 1800);
  });
}

// Carrega avaliações persistidas no localStorage (mescladas com as do arquivo)
function loadAvaliacoes() {
  const local = JSON.parse(localStorage.getItem('avaliacoes_premiacao') || '[]');
  const map = {};
  AVALIACOES.forEach(a => map[a.id_sugestao] = a);
  local.forEach(a => map[a.id_sugestao] = a); // local sobrescreve (mais recente)
  return map;
}

function salvarAvaliacao(idSug, resultado, comentario) {
  const local = JSON.parse(localStorage.getItem('avaliacoes_premiacao') || '[]');
  const idx = local.findIndex(a => a.id_sugestao === idSug);
  const reg = {
    id_sugestao: idSug,
    resultado,
    comentario: comentario || '',
    avaliado_em: new Date().toISOString().slice(0,10)
  };
  if (idx >= 0) local[idx] = reg; else local.push(reg);
  localStorage.setItem('avaliacoes_premiacao', JSON.stringify(local));
  // Escrita-dupla: Supabase (durável) + Worker (fallback)
  supaUpsert('sugestoes_avaliacoes', {id_sugestao: reg.id_sugestao, resultado: reg.resultado, comentario: reg.comentario||'', em: new Date().toISOString()}, 'id_sugestao');
  fetch(`${WORKER_URL}/avaliacao`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(reg)
  }).catch(e => console.warn('[avaliacao] falha de envio:', e));
  const card = document.querySelector(`.sug-card[data-id="${idSug}"]`);
  if (card) {
    card.setAttribute('data-aval', resultado);
    card.querySelectorAll('.sug-btn').forEach(b => {
      b.classList.toggle(`on-${b.dataset.res}`, b.dataset.res === resultado);
    });
    const saved = card.querySelector('.sug-saved');
    if (saved) saved.textContent = `✓ Avaliado em ${reg.avaliado_em} — sincroniza no próximo update do dashboard`;
  }
  if (curTab === 'analise') rerender();
}

// `btn` vem do onclick via `this` — capturado AGORA, de forma síncrona. Nunca ler
// `event.target` dentro do .then: quando a resposta chega o event global já morreu
// e o TypeError cai no .catch, virando um falso "Sem conexão" (bug de 15/07).
function salvarRetornoFeedback(idSug, loja, vendedora, btn) {
  const statusSel = document.getElementById(`ret-status-${idSug}-${vendedora}`);
  const txtSel = document.getElementById(`ret-txt-${idSug}-${vendedora}`);
  if (!statusSel || !txtSel) return;
  const status = statusSel.value;
  const texto = txtSel.value;
  if (!status) {
    alert('Escolha um status (Excelente / Reconhecida / Precisa melhorar) antes de salvar.');
    return;
  }
  const reg = {id_sugestao: idSug, loja, vendedora, status, texto, em: new Date().toISOString()};
  // Atualiza cache local
  window.__FEEDBACK_RETORNOS = window.__FEEDBACK_RETORNOS || [];
  const cache = window.__FEEDBACK_RETORNOS;
  const idx = cache.findIndex(r => r.id_sugestao === idSug && r.loja === loja && r.vendedora === vendedora);
  if (idx >= 0) cache[idx] = reg; else cache.push(reg);
  // Escrita-dupla: Supabase (durável) + Worker (fallback)
  supaUpsert('feedback_retornos', {id_sugestao: reg.id_sugestao, loja: reg.loja, vendedora: reg.vendedora, status: reg.status, texto: reg.texto||'', em: new Date().toISOString()}, 'id_sugestao,loja,vendedora');
  fetch(`${WORKER_URL}/feedback-retorno`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(reg)
  }).then(r => {
    if (!r.ok) { alert('Falha ao salvar (servidor respondeu ' + r.status + '). Tente de novo.'); return; }
    // Daqui pra baixo é só tela/push: um erro aqui NÃO significa que o salvamento falhou,
    // então isola em try/catch pra não cair no .catch de rede.
    try {
      if (btn) {
        btn.textContent = '✓ Salvo';
        setTimeout(() => { btn.textContent = '💾 Salvar retorno'; rerender(); }, 1500);
      } else { rerender(); }
      // Avisa a vendedora no celular que a gestão respondeu o feedback dela.
      const emojiRet = status === 'excelente' ? '⭐' : status === 'reconhecida' ? '👏' : '📨';
      enviarPush({ loja, vendedora, titulo: `${emojiRet} Retorno da gestão pra você`,
        corpo: 'O Athila respondeu seu feedback — abre o app pra ler.' });
    } catch (e) { console.warn('[retorno] salvo, mas falhou a tela/push:', e); }
  }).catch(e => {
    console.warn('[retorno] falha de rede:', e);
    alert('Sem conexão com o servidor. O retorno NÃO foi salvo — tente de novo.');
  });
}

let _debounceComent = {};
function salvarComentario(idSug, texto) {
  const local = JSON.parse(localStorage.getItem('avaliacoes_premiacao') || '[]');
  const reg = local.find(a => a.id_sugestao === idSug);
  if (!reg) return; // só salva comentário se já há avaliação
  reg.comentario = texto;
  reg.avaliado_em = new Date().toISOString().slice(0,10);
  localStorage.setItem('avaliacoes_premiacao', JSON.stringify(local));
  // Escrita-dupla debounced (oninput dispara a cada tecla). Sem isso o
  // comentário editado depois da avaliação ficava SÓ neste navegador e a
  // Etapa 3 do agente (que lê do Worker) nunca o via.
  clearTimeout(_debounceComent[idSug]);
  _debounceComent[idSug] = setTimeout(() => {
    supaUpsert('sugestoes_avaliacoes', {id_sugestao: idSug, resultado: reg.resultado, comentario: reg.comentario||'', em: new Date().toISOString()}, 'id_sugestao');
    fetch(`${WORKER_URL}/avaliacao`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id_sugestao: idSug, resultado: reg.resultado, comentario: reg.comentario||''})
    }).catch(e => console.warn('[avaliacao] falha ao enviar comentário:', e));
  }, 900);
}

// Semana ISO REAL de hoje (não mais "a última chave existente em SUGESTOES").
// Antes, se a geração semanal falhasse, o painel mostrava a última semana
// disponível como se fosse a atual — sem avisar que estava desatualizada
// (foi assim que W26/W27 ficaram invisíveis 2 semanas seguidas em jun/jul).
// Ver [[premiacao_sugestoes_redesign]].
function _isoSemanaDeHoje() {
  const hoje = new Date();
  const d = new Date(Date.UTC(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const semana = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return {ano: d.getUTCFullYear(), semana, key: `${d.getUTCFullYear()}-W${String(semana).padStart(2,'0')}`};
}

// ─── FILA "AGUARDANDO AVALIAÇÃO" ──────────────────────────────────────────────
// Varre TODAS as semanas fechadas (anteriores à atual) e lista sugestões sem
// veredito nenhum — nem manual (AVALIACOES) nem automático (calcAutoMetrics).
// Resolve a invisibilidade do backlog: antes, sugestão de semana passada só
// aparecia em Análise SE já avaliada; sem isso, 40 sugestões (W22-W27) ficaram
// invisíveis e ninguém percebeu que não estavam sendo avaliadas.
// A fila só vale de W28/2026 em diante (decisão do Athila 04/07/2026): as 17
// sugestões antigas sem métrica automática (W22-W27) NÃO precisam de avaliação —
// o conceito da fila é cobrar avaliação no FIM DO PRAZO de cada sugestão, valendo
// só pro sistema novo. Não baixar essa constante.
const FILA_AVALIACAO_DESDE = {ano: 2026, semana: 28};

function getFilaAvaliacaoPendente() {
  const atual = _isoSemanaDeHoje();
  const avalMap = loadAvaliacoes();
  const ovs = loadSugestoesOverrides();
  const pendentes = [];
  for (const [semKey, sem] of Object.entries(SUGESTOES)) {
    const m = semKey.match(/^(\d{4})-W(\d+)$/);
    if (!m) continue;
    const ano = +m[1], semana = +m[2];
    if (ano < FILA_AVALIACAO_DESDE.ano || (ano === FILA_AVALIACAO_DESDE.ano && semana < FILA_AVALIACAO_DESDE.semana)) continue; // legado fora da fila
    if (ano > atual.ano || (ano === atual.ano && semana >= atual.semana)) continue; // só semanas fechadas
    (sem.itens || []).forEach(s => {
      // Só faz sentido avaliar o que foi de fato APROVADO (chegou pra equipe).
      // Rejeitada ou nunca revisada (ainda pendente de aprovação) não entra aqui.
      const statusEfetivo = ovs[s.id]?.status || s.status || 'pendente';
      if (statusEfetivo !== 'aprovada') return;
      if (avalMap[s.id]) return; // já avaliada manualmente
      const auto = calcAutoMetrics(s);
      if (auto && auto.tipo === 'calculado' && auto.status !== null) return; // já avaliada automaticamente
      pendentes.push({s, semKey, ano, semana, temAuto: !!(auto && auto.tipo === 'calculado')});
    });
  }
  pendentes.sort((a,b) => a.ano - b.ano || a.semana - b.semana);
  return pendentes;
}

      </div>

  return `<div style="background:rgba(234,179,8,.08);border:1px solid rgba(234,179,8,.35);border-radius:10px;padding:12px 14px;margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">

      <span style="background:rgba(234,179,8,.25);color:var(--yellow);padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700">${pendentes.length}</span>
    </div>

    ${pendentes.length > 30 ? `<div style="font-size:11px;color:var(--muted);margin-top:6px">+ ${pendentes.length-30} mais antigas...</div>` : ''}

function _supaHeaders(extra) {

// Upsert das metas ajustadas (uma linha por semana). Chamado em setDecisaoMeta.
async function salvarMetasSupabase(mes, loja, metas) {
  const rows = (metas||[]).filter(m => typeof m.nova === 'number')
    .map(m => ({mes, loja, semana: m.id, meta: Math.round(m.nova)}));

// ── Camada genérica Supabase (escrita-dupla + leitura com fallback) ──
// Escrita: grava no Supabase (durável) E no Worker → nada se perde.
// Leitura: junta os dois (dedup por chave, registro mais recente vence) →
// durante a transição nenhum dado some, mesmo o que ainda só está no Worker.
async function supaUpsert(table, rows, onConflict) {
  const arr = Array.isArray(rows) ? rows : [rows];
  if (!arr.length) return false;
  try {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}` + (onConflict ? `?on_conflict=${onConflict}` : ''), {
      method: 'POST', headers: _supaHeaders({Prefer: 'resolution=merge-duplicates,return=minimal'}),
      body: JSON.stringify(arr)
    });
    return r.ok;
  } catch(e) { console.warn(`[supa ${table}] upsert falhou:`, e); return false; }
}
async function supaSelect(table, query) {
  try {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${query || 'select=*'}`, {headers: _supaHeaders(), cache: 'no-store'});
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { console.warn(`[supa ${table}] select falhou:`, e); return null; }
}
// Junta itens do Worker + Supabase, dedup por keyFn, mais recente (em) vence.
function mergeItens(workerItems, supaItems, keyFn) {
  const map = new Map();
  for (const it of (workerItems || [])) map.set(keyFn(it), it);
  for (const it of (supaItems || [])) {
    const k = keyFn(it), cur = map.get(k);
    if (!cur || new Date(it.em||0) >= new Date(cur.em||0)) map.set(k, it);
  }
  return [...map.values()];
}

// O agente agora lê avaliações/overrides/metas do Worker (+Supabase), não mais

// offline, registro anterior à escrita-dupla) é reenviado no boot. Só reenvia o
// que está ausente ou mais novo que o remoto → converge em 1 boot, sem loop.
function drenarLocalParaStores(overrides, avaliacoes, metasLoja) {
  try {
    const localOv = JSON.parse(localStorage.getItem('sugestoes_overrides') || '{}');
    for (const [id, reg] of Object.entries(localOv)) {
      const remoto = overrides.find(o => o.id_sugestao === id);
      if (!remoto || new Date(reg.em||0) > new Date(remoto.em||0)) enviarOverrideWorker(id, reg);
    }
    const localAv = JSON.parse(localStorage.getItem('avaliacoes_premiacao') || '[]');
    for (const a of localAv) {
      const remoto = avaliacoes.find(x => x.id_sugestao === a.id_sugestao);
      if (remoto && new Date(remoto.em||0) >= new Date(a.em||a.avaliado_em||0)) continue;
      supaUpsert('sugestoes_avaliacoes', {id_sugestao: a.id_sugestao, resultado: a.resultado, comentario: a.comentario||'', em: new Date().toISOString()}, 'id_sugestao');
      fetch(`${WORKER_URL}/avaliacao`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id_sugestao: a.id_sugestao, resultado: a.resultado, comentario: a.comentario||''})
      }).catch(()=>{});
    }
    const decisoes = loadDecisoesMeta();
    for (const [key, dec] of Object.entries(decisoes)) {
      if (!dec || dec.tipo === 'ignorado' || !Array.isArray(dec.metas)) continue;
      const [mes, loja] = key.split('|');
      const remoto = metasLoja.find(m => m.mes === mes && m.loja === loja);
      if (remoto && new Date(remoto.em||0) >= new Date(dec.em||0)) continue;
      salvarMetasSupabase(mes, loja, dec.metas);
      fetch(`${WORKER_URL}/metas-loja`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({mes, loja, tipo: dec.tipo || 'custom', metas: dec.metas})
      }).catch(()=>{});
    }
    // Fila legada da Etapa 3 via Chrome MCP — sem consumidor desde 04/07/2026.
    localStorage.removeItem('ajustes_meta_pendentes');
  } catch(e) { console.warn('[dreno] falhou:', e); }
}

function _semanaAnteriorKey() {

  const atual = `${a.ano}-W${String(a.semana).padStart(2,'0')}`;
  const anteriores = chaves.filter(k => k < atual);
  return anteriores.length ? anteriores[anteriores.length-1] : null;

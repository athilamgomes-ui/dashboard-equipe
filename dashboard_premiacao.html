const _RET_STATUS_POR_VEREDITO = {funcionou:'excelente', parcial:'reconhecida', nao_funcionou:'precisa_melhorar'};

function renderResultadoSemanaPassada() {
  const semKey = _semanaAnteriorKey();
  if (!semKey || !SUGESTOES[semKey]) return '';
  const ovs = loadSugestoesOverrides();
  const retornos = window.__FEEDBACK_RETORNOS || [];
  const itens = (SUGESTOES[semKey].itens || []).filter(s => (ovs[s.id]?.status || s.status) === 'aprovada');
  if (!itens.length) return '';

  let nFunc = 0, nNao = 0, cards = '';
  for (const s of itens) {
    const auto = calcAutoMetrics(s);
    const temVeredito = auto && auto.tipo === 'calculado' && auto.status;
    if (temVeredito) { if (auto.status === 'funcionou') nFunc++; else if (auto.status === 'nao_funcionou') nNao++; }
    const alvoVend = s.escopo === 'vendedora' && s.vendedora ? s.vendedora : '_loja';
    const ret = retornos.find(r => r.id_sugestao === s.id && r.loja === s.loja && r.vendedora === alvoVend);
    const msg = temVeredito ? (gerarMensagemFeedback(s, auto) || '') : '';
    const textoInicial = ret?.texto || msg;
    const statusInicial = ret?.status || (temVeredito ? _RET_STATUS_POR_VEREDITO[auto.status] : '');
    const cor = !temVeredito ? 'var(--muted)' : auto.status==='funcionou' ? 'var(--green)' : auto.status==='parcial' ? 'var(--yellow)' : 'var(--red)';
    const lbl = !temVeredito ? '— sem métrica automática' : auto.status==='funcionou' ? '✓ Funcionou' : auto.status==='parcial' ? '~ Parcial' : '✗ Não funcionou';
    const quem = s.escopo === 'vendedora' ? s.vendedora : s.escopo === 'loja' ? `equipe ${s.loja}` : 'todas as lojas';
    if (s.escopo === 'geral') continue; // geral não tem destinatário único

    cards += `<div style="background:var(--bg2);border:1px solid var(--border);border-left:3px solid ${cor};border-radius:0;padding:10px 12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <div style="font-size:12px;font-weight:600">${s.titulo}</div>
        <div style="font-size:11px;font-weight:700;color:${cor};white-space:nowrap">${lbl}${temVeredito&&auto.deltaStr?` · ${auto.deltaStr}`:''}</div>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px">Pra: <b>${quem}</b>${temVeredito&&auto.baseline!=null?` · ${Math.round(auto.baseline)} → ${Math.round(auto.resultado)} ${auto.unidade||''}`:''}</div>
      <select id="ret-status-${s.id}-${alvoVend}" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:4px 6px;font-size:11px;width:100%;margin-top:8px">
        <option value="">— escolha um status —</option>
        <option value="excelente" ${statusInicial==='excelente'?'selected':''}>⭐ Excelente — exemplo pra equipe</option>
        <option value="reconhecida" ${statusInicial==='reconhecida'?'selected':''}>👏 Reconhecida — bom trabalho</option>
        <option value="precisa_melhorar" ${statusInicial==='precisa_melhorar'?'selected':''}>⚠️ Precisa melhorar</option>
      </select>
      <textarea id="ret-txt-${s.id}-${alvoVend}" class="sug-comment" style="min-height:54px;font-size:11px;margin-top:6px" placeholder="Mensagem pra ${quem}...">${textoInicial}</textarea>
      <div style="display:flex;gap:6px;align-items:center;margin-top:4px">
        <button class="sug-btn" style="background:rgba(124,92,252,.2);color:#9d8aff;border-color:rgba(124,92,252,.5);font-size:11px;padding:5px 10px" onclick="salvarRetornoFeedback('${s.id}','${s.loja}','${alvoVend}',this)">
          ${ret ? '💾 Atualizar' : '📨 Enviar pra ' + quem}
        </button>
        ${ret ? `<span style="font-size:10px;color:var(--green)">✓ enviado ${(ret.em||'').slice(0,10)}</span>` : ''}
      </div>
    </div>`;
  }
  const enviados = itens.filter(s => {
    const av = s.escopo==='vendedora'&&s.vendedora ? s.vendedora : '_loja';
    return retornos.some(r => r.id_sugestao===s.id && r.vendedora===av);
  }).length;

  return `<details style="background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.3);border-radius:12px;padding:12px 14px;margin-bottom:14px" open>
    <summary style="cursor:pointer;font-size:13px;color:var(--blue);font-weight:600">
      📊 Resultado da semana passada (${semKey}) — ${nFunc} funcionaram · ${nNao} não · ${enviados}/${itens.length-1} retornos enviados
    </summary>
    <div style="font-size:11px;color:var(--muted);margin:6px 0 10px">Veredito calculado com dado real do ERP. A mensagem já vem pronta — revise, edite se quiser e clique em enviar. A vendedora vê no app dela.</div>
    ${cards}
  </details>`;
}

// ─── AVALIAÇÕES DO MÊS (Feedback v2, 04/08/2026) ─────────────────────────────
// Avaliação individual do mês fechado + objetivo do novo período. Vive numa chave
// própria de SUGESTOES ('AVAL-2026-07', fora da semana corrente) pra NÃO misturar
// com as sugestões da semana no app (getMinhasSugestoesAprovadas é só da semana).
// Reusa 100% o fluxo de aprovar/editar/rejeitar (handlers por data-id) e overrides.
const AVAL_MES_KEY = 'AVAL-2026-07';
const AVAL_MES_LABEL = 'julho';
function renderAvaliacoesMes() {
  const sem = SUGESTOES[AVAL_MES_KEY];
  if (!sem || !sem.itens || !sem.itens.length) return '';
  const ovs = loadSugestoesOverrides();
  const itens = sem.itens.slice().map(s => {
    const ov = ovs[s.id];
    return {...s, _status: ov?.status || s.status || 'pendente', _texto: ov?.texto_editado || s.descricao, _prazo: ov?.prazo || s.prazo || 'medio', _statusEm: ov?.em || null};
  }).sort((a, b) => {
    const ord = {pendente: 0, aprovada: 1, rejeitada: 2};
    if (ord[a._status] !== ord[b._status]) return ord[a._status] - ord[b._status];
    return (a.loja || 'Z').localeCompare(b.loja || 'Z');
  });
  const pend = itens.filter(i => i._status === 'pendente').length;
  const aprov = itens.filter(i => i._status === 'aprovada').length;
  const cards = itens.map(s => {
    const isPend = s._status === 'pendente', isAprov = s._status === 'aprovada', isRej = s._status === 'rejeitada';
    const chips = [
      s.loja ? `<span class="sug-chip loja" style="color:${LOJAS_BASE[s.loja].cor}">${s.loja}</span>` : '',
      s.vendedora ? `<span class="sug-chip vend">${s.vendedora}</span>` : '',
      s.meta_alvo ? `<span class="sug-chip alvo">🎯 ${ALVO_LABELS[s.meta_alvo] || s.meta_alvo}${s.meta_valor != null ? ' → ' + s.meta_valor : ''}</span>` : '',
    ].filter(Boolean).join('');
    const badge = isPend
      ? `<span style="background:rgba(234,179,8,.2);color:var(--yellow);padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase">🟡 PENDENTE</span>`
      : isAprov
      ? `<span style="background:rgba(34,197,94,.2);color:var(--green);padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase">🟢 APROVADA</span>`
      : `<span style="background:rgba(148,163,184,.15);color:var(--muted);padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase">🔴 REJEITADA</span>`;
    let actions = '';
    if (isPend) {
      actions = `
        <div class="sug-actions" style="gap:6px;margin-top:8px">
          <button class="sug-btn" style="background:rgba(34,197,94,.2);color:var(--green);border-color:var(--green);font-weight:700" onclick="aprovarComPrazo('${s.id}')">✓ Aprovar</button>
          <button class="sug-btn" style="background:rgba(234,179,8,.2);color:var(--yellow);border-color:var(--yellow)" onclick="toggleEditor('${s.id}')">✏️ Editar</button>
          <button class="sug-btn" style="background:rgba(239,68,68,.15);color:var(--red);border-color:var(--red)" onclick="rejeitarSugestao('${s.id}')">❌ Rejeitar</button>
        </div>
        <div class="sug-editor" style="display:none;margin-top:8px">
          <textarea class="sug-comment" style="min-height:120px;width:100%">${s.descricao.replace(/</g, '&lt;')}</textarea>
          ${_alvoEditavelFrag(s)}
          <button class="sug-btn" style="background:var(--blue);color:#fff;border:none;margin-top:6px;width:100%" onclick="aprovarComPrazo('${s.id}')">💾 Salvar texto + aprovar</button>
        </div>`;
    } else if (isAprov) {
      actions = `
        <div style="font-size:11px;color:var(--muted);margin-top:4px">✓ Aprovada${s._statusEm ? ` em ${s._statusEm.slice(0,10)}` : ''} · visível pra ${s.vendedora} no app (aba Meu Progresso)</div>
        <button class="sug-btn" style="background:transparent;color:var(--muted);border-color:var(--border);margin-top:6px;width:auto;padding:4px 10px;font-size:11px" onclick="voltarSugestaoPendente('${s.id}')">↩️ Voltar pra pendente</button>`;
    } else {
      actions = `
        <div style="font-size:11px;color:var(--muted);margin-top:4px">✗ Rejeitada · NÃO vai pra vendedora</div>
        <button class="sug-btn" style="background:transparent;color:var(--muted);border-color:var(--border);margin-top:6px;width:auto;padding:4px 10px;font-size:11px" onclick="voltarSugestaoPendente('${s.id}')">↩️ Voltar pra pendente</button>`;
    }
    return `<div class="sug-card" data-id="${s.id}" data-status="${s._status}" data-tipo="avaliacao" style="border-left:4px solid ${isPend ? 'var(--yellow)' : isAprov ? 'var(--green)' : 'var(--red)'}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div class="sug-meta">${chips}</div>
        ${badge}
      </div>
      <div class="sug-ttl">${s.titulo}</div>
      <div class="sug-desc">${s._texto}${s._texto !== s.descricao ? '<div style="color:var(--yellow);font-size:10px;margin-top:6px">✏️ texto editado por você</div>' : ''}</div>
      ${actions}
    </div>`;
  }).join('');
  return `
    <div class="sug-hdr" style="background:linear-gradient(135deg,rgba(124,92,252,.10),rgba(59,130,246,.05));border-color:rgba(124,92,252,.3)">
      <div>
        <h2 style="color:#a78bfa">📋 Avaliações de ${AVAL_MES_LABEL} + objetivo do período</h2>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">Uma por vendedora — resultado do mês + o foco de melhoria. Aprove/edite; só as aprovadas aparecem pra ela no app.</div>
      </div>
      <div class="pill">🟡 Pendentes: <b style="color:var(--yellow)">${pend}</b></div>
      <div class="pill">🟢 Aprovadas: <b style="color:var(--green)">${aprov}</b></div>
    </div>
    <div class="sug-grid">${cards}</div>
    <div style="height:1px;background:var(--border);margin:18px 0"></div>
  `;
}

function renderSugestoes() {
  const avalMes = renderAvaliacoesMes();
  const semKey = getSemanaCorrente();
  const sem = SUGESTOES[semKey];
  const filaPendente = renderFilaAvaliacaoPendente();
  const resultadoAnterior = renderResultadoSemanaPassada();
  if (!sem || !sem.itens || sem.itens.length === 0) {
    return avalMes + resultadoAnterior + filaPendente + `<div class="sug-empty">
      <h2 style="color:var(--text);margin-bottom:8px">Sem sugestões para essa semana (${semKey})</h2>
      <p>O agente gera novas sugestões todo sábado às 18h, pra semana seguinte.</p>
    </div>`;
  }
  const avalMap = loadAvaliacoes();
  const ovs = loadSugestoesOverrides();
  const itens = sem.itens.slice();

  // Calcula status e texto efetivos
  itens.forEach(s => {
    const ov = ovs[s.id];
    s._status = ov?.status || s.status || 'pendente';
    s._texto = ov?.texto_editado || s.descricao;
    s._statusEm = ov?.em || null;
    s._prazo = ov?.prazo || s.prazo || 'curto';
    s._feedbacks = s.feedbacks || [];
  });

  // Ordenar: pendentes → aprovadas → rejeitadas; depois por loja
  const ord = {pendente: 0, aprovada: 1, rejeitada: 2};
  itens.sort((a,b) => {
    if (ord[a._status] !== ord[b._status]) return ord[a._status] - ord[b._status];
    return (a.loja||'Z').localeCompare(b.loja||'Z');
  });

  const cards = itens.map(s => {
    const isPendente = s._status === 'pendente';
    const isAprovada = s._status === 'aprovada';
    const isRejeitada = s._status === 'rejeitada';
    const a = avalMap[s.id];
    const aval = a?.resultado || '';
    const com = a?.comentario || '';

    const chips = [
      s.loja ? `<span class="sug-chip loja" style="color:${LOJAS_BASE[s.loja].cor}">${s.loja}</span>` : `<span class="sug-chip loja">GERAL</span>`,
      s.vendedora ? `<span class="sug-chip vend">${s.vendedora}</span>` : '',
      `<span class="sug-chip tipo">${TIPO_LABELS[s.tipo]||s.tipo}</span>`,
      s.meta_alvo ? `<span class="sug-chip alvo">${ALVO_LABELS[s.meta_alvo]||s.meta_alvo}</span>` : '',
    ].filter(Boolean).join('');

    // Badge de status
    const statusBadge = isPendente
      ? `<span style="background:rgba(234,179,8,.2);color:var(--yellow);padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase">🟡 PENDENTE</span>`
      : isAprovada
      ? `<span style="background:rgba(34,197,94,.2);color:var(--green);padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase">🟢 APROVADA</span>`
      : `<span style="background:rgba(148,163,184,.15);color:var(--muted);padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase">🔴 REJEITADA</span>`;

    // Prazo selector (visível em pendente e aprovada)
    const prazoSelector = `
      <div style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px">
        <span style="color:var(--muted)">Prazo pra avaliar:</span>
        <select class="prazo-select" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:3px 6px;font-size:11px;cursor:pointer" onchange="this.dataset.changed='true'">
          <option value="curto" ${s._prazo==='curto'?'selected':''}>🟢 Curto (1 sem)</option>
          <option value="medio" ${s._prazo==='medio'?'selected':''}>🟡 Médio (1 mês)</option>
          <option value="longo" ${s._prazo==='longo'?'selected':''}>🔵 Longo (3 meses)</option>
        </select>
      </div>`;

    // Feedbacks das vendedoras
    const totFb = s._feedbacks.length;
    const retornos = window.__FEEDBACK_RETORNOS || [];
    const sugeridos = window.__TEXTOS_SUGERIDOS || [];
    const fbBlock = totFb > 0 ? `
      <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border)">
        <button class="sug-btn" style="background:transparent;color:var(--blue);border-color:var(--blue);padding:5px 10px;font-size:11px;cursor:pointer" onclick="toggleFeedbacks('${s.id}')">
          💬 ${totFb} feedback${totFb>1?'s':''} da equipe
        </button>
        <div id="fbs-${s.id}" style="display:none;margin-top:8px">
          ${s._feedbacks.map(fb => {
            const cls = fb.acao==='apliquei'?'color:var(--green)':fb.acao==='tentei'?'color:var(--yellow)':'color:var(--red)';
            const lbl = fb.acao==='apliquei'?'✓ Apliquei':fb.acao==='tentei'?'🟡 Tentei mas tá difícil':'❌ Não consegui aplicar';
            // Retorno APROVADO (já enviado, vendedora já viu)
            const ret = retornos.find(r => r.id_sugestao === fb.id_sugestao && r.loja === fb.loja && r.vendedora === fb.vendedora);
            // Texto sugerido (rascunho do sistema) — só pre-fill, não aprovado
            const sug = sugeridos.find(s => s.id_sugestao === fb.id_sugestao && s.loja === fb.loja && s.vendedora === fb.vendedora);
            const statusInicial = ret?.status || sug?.status || '';
            const textoInicial = ret?.texto || sug?.texto || '';
            const ehSugestao = !ret && !!sug;
            const retornoUI = `
              <div style="margin-top:8px;padding:8px;background:${ret?'rgba(34,197,94,.10)':ehSugestao?'rgba(234,179,8,.08)':'rgba(124,92,252,.08)'};border-radius:6px;border-left:2px solid ${ret?'var(--green)':ehSugestao?'var(--yellow)':'rgba(124,92,252,.6)'}">
                <div style="font-size:10px;font-weight:700;color:${ret?'var(--green)':ehSugestao?'var(--yellow)':'#9d8aff'};letter-spacing:.4px;margin-bottom:6px">
                  ${ret ? '✅ APROVADO E ENVIADO PRA ' + fb.vendedora.toUpperCase() : ehSugestao ? '✏️ RASCUNHO SUGERIDO PELO SISTEMA — REVISE E APROVE' : '📨 FEEDBACK PRA ' + fb.vendedora.toUpperCase()}
                </div>
                <select id="ret-status-${fb.id_sugestao}-${fb.vendedora}" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:4px 6px;font-size:11px;width:100%;margin-bottom:6px">
                  <option value="">— escolha um status —</option>
                  <option value="excelente" ${statusInicial==='excelente'?'selected':''}>⭐ Excelente — exemplo pra equipe</option>
                  <option value="reconhecida" ${statusInicial==='reconhecida'?'selected':''}>👏 Reconhecida — bom trabalho</option>
                  <option value="precisa_melhorar" ${statusInicial==='precisa_melhorar'?'selected':''}>⚠️ Precisa melhorar — não vi resultado</option>
                </select>
                <textarea id="ret-txt-${fb.id_sugestao}-${fb.vendedora}" class="sug-comment" placeholder="Mensagem pra ela: o que você viu, o que espera..." style="min-height:50px;font-size:11px">${textoInicial}</textarea>
                <div style="display:flex;gap:6px;align-items:center;margin-top:4px">
                  <button class="sug-btn" style="background:rgba(124,92,252,.2);color:#9d8aff;border-color:rgba(124,92,252,.5);font-size:11px;padding:5px 10px" onclick="salvarRetornoFeedback('${fb.id_sugestao}','${fb.loja}','${fb.vendedora}',this)">
                    ${ret ? '💾 Atualizar retorno' : ehSugestao ? '✓ Aprovar e enviar' : '💾 Salvar e enviar'}
                  </button>
                  ${ret ? `<span style="font-size:10px;color:var(--green)">enviado em ${(ret.em||'').slice(0,16).replace('T',' ')}</span>` : ''}
                  ${ehSugestao ? '<span style="font-size:10px;color:var(--yellow)">⚠️ NÃO foi enviado ainda — vendedora não vê até você clicar Aprovar</span>' : ''}
                </div>
              </div>`;
            return `<div style="background:var(--bg3);border-radius:7px;padding:8px 10px;margin-bottom:6px">
              <div style="font-size:11px;display:flex;justify-content:space-between"><span style="font-weight:700">${fb.vendedora}</span><span style="${cls};font-weight:600">${lbl}</span></div>
              ${fb.comentario ? `<div style="font-size:12px;color:#cbd5e1;margin-top:4px">"${fb.comentario}"</div>` : ''}
              <div style="font-size:10px;color:var(--muted);margin-top:4px">${fb.em ? fb.em.slice(0,10) : ''}</div>
              ${retornoUI}
            </div>`;
          }).join('')}
        </div>
      </div>` : '';

    // Ações por status
    let actions = '';
    if (isPendente) {
      actions = `
        ${prazoSelector}
        <div class="sug-actions" style="gap:6px;margin-top:8px">
          <button class="sug-btn" style="background:rgba(34,197,94,.2);color:var(--green);border-color:var(--green);font-weight:700" onclick="aprovarComPrazo('${s.id}')">✓ Aprovar</button>
          <button class="sug-btn" style="background:rgba(234,179,8,.2);color:var(--yellow);border-color:var(--yellow)" onclick="toggleEditor('${s.id}')">✏️ Editar</button>
          <button class="sug-btn" style="background:rgba(239,68,68,.15);color:var(--red);border-color:var(--red)" onclick="rejeitarSugestao('${s.id}')">❌ Rejeitar</button>
        </div>
        <div class="sug-editor" style="display:none;margin-top:8px">
          <textarea class="sug-comment" style="min-height:80px;width:100%">${s.descricao.replace(/</g,'&lt;')}</textarea>
          ${_alvoEditavelFrag(s)}
          <button class="sug-btn" style="background:var(--blue);color:#fff;border:none;margin-top:6px;width:100%" onclick="aprovarComPrazo('${s.id}')">💾 Salvar texto + aprovar</button>
        </div>`;
    } else if (isAprovada) {
      // Mostra avaliação se já tem, ou botões de avaliação (sábado)
      const btnsAval = ['funcionou','indiferente','nao_funcionou'].map(r => `
        <button class="sug-btn ${aval===r?'on-'+r:''}" data-res="${r}"
          onclick="salvarAvaliacao('${s.id}','${r}', document.getElementById('com-${s.id}').value)">
          ${RES_LABELS[r]}
        </button>`).join('');
      const prazoLabel = s._prazo==='curto'?'🟢 Curto (avalia em 1 sem)':s._prazo==='medio'?'🟡 Médio (avalia em 1 mês)':'🔵 Longo (avalia em 3 meses)';
      actions = `
        <div style="font-size:11px;color:var(--muted);margin-top:4px">✓ Aprovada${s._statusEm?` em ${s._statusEm.slice(0,10)}`:''} · visível pras vendedoras · ${prazoLabel}</div>
        ${renderStatusObjetivo(s)}
        ${fbBlock}
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:10px;border-top:1px solid var(--border);padding-top:8px">📊 Sua avaliação (subjetiva)</div>
        <div class="sug-actions" style="gap:6px;margin-top:6px">${btnsAval}</div>
        <textarea id="com-${s.id}" class="sug-comment" placeholder="Comentário (opcional): o que aconteceu, resultado em R$..." oninput="salvarComentario('${s.id}', this.value)">${com}</textarea>
        <button class="sug-btn" style="background:transparent;color:var(--muted);border-color:var(--border);margin-top:6px;width:auto;padding:4px 10px;font-size:11px" onclick="voltarSugestaoPendente('${s.id}')">↩️ Voltar pra pendente</button>`;
    } else { // rejeitada
      actions = `

    return `<div class="sug-card" data-id="${s.id}" data-aval="${aval}" data-status="${s._status}" data-tipo="${s.tipo}" style="border-left:4px solid ${isPendente?'var(--yellow)':isAprovada?'var(--green)':'var(--red)'}">

  const totN = itens.length;
  const pendentes = itens.filter(i => i._status === 'pendente').length;
  const aprovadas = itens.filter(i => i._status === 'aprovada').length;
  const rejeitadas = itens.filter(i => i._status === 'rejeitada').length;
  const aprovadasAval = itens.filter(i => i._status === 'aprovada' && avalMap[i.id]).length;

  return avalMes + resultadoAnterior + filaPendente + `

      <br><br>⚠️ Vendedoras só veem sugestões <b>aprovadas</b>. Pendentes/rejeitadas ficam só com você.

}

// ─── ANÁLISE (4 gráficos + recentes) ─────────────────────────────────────────

// Resultado efetivo de uma sugestão: manual (AVALIACOES) tem prioridade se existir;
// senão usa o automático (calcAutoMetrics), mapeando 'parcial' → 'indiferente' pro
// mesmo esquema de 3 baldes. Retorna null se não há veredito nenhum (adicionado
// 04/07/2026 — antes a Análise só enxergava avaliação manual, ignorando os
// resultados automáticos, mesmo depois do motor virar generalizado).
function getResultadoEfetivo(s, avalMap) {
  const a = avalMap[s.id];
  if (a) return {resultado: a.resultado, origem: 'manual'};
  const auto = calcAutoMetrics(s);
  if (auto && auto.tipo === 'calculado' && auto.status !== null) {
    const resultado = auto.status === 'parcial' ? 'indiferente' : auto.status;
    return {resultado, origem: 'automatico', delta: auto.deltaStr};
  }
  return null;
}

function agruparPor(getKey) {
  // Junta TODAS as sugestões já lançadas (de todas as semanas) com veredito —
  // manual OU automático (ver getResultadoEfetivo).
  const avalMap = loadAvaliacoes();
  const buckets = {}; // key -> {func, indif, nao}
  Object.values(SUGESTOES).forEach(sem => {
    sem.itens.forEach(s => {
      const ef = getResultadoEfetivo(s, avalMap);
      if (!ef) return;
      const key = getKey(s);
      if (!key) return;
      const arr = Array.isArray(key) ? key : [key];
      arr.forEach(k => {
        if (!buckets[k]) buckets[k] = {func:0, indif:0, nao:0};
        if (ef.resultado === 'funcionou') buckets[k].func++;
        else if (ef.resultado === 'indiferente') buckets[k].indif++;
        else if (ef.resultado === 'nao_funcionou') buckets[k].nao++;
      });
    });
  });
  return buckets;
}

function renderChartCard(titulo, subtitulo, buckets, labelFn) {
  const entries = Object.entries(buckets).map(([k,v]) => {
    const tot = v.func + v.indif + v.nao;
    const score = tot > 0 ? (v.func*100 + v.indif*50) / tot : 0; // 0-100
    return [k, v, tot, score];
  }).sort((a,b) => b[3] - a[3] || b[2] - a[2]);
  if (entries.length === 0) {
    return `<div class="chart-card"><h3>${titulo}</h3><div class="chart-sub">${subtitulo}</div>
      <div style="color:var(--muted);text-align:center;padding:20px 0;font-size:12px">Ainda sem avaliações nessa categoria</div>
    </div>`;
  }
  const maxTot = Math.max(...entries.map(e => e[2]));
  const rows = entries.map(([k,v,tot,score]) => {
    const fW = tot>0 ? v.func/tot*100 : 0;
    const iW = tot>0 ? v.indif/tot*100 : 0;
    const nW = tot>0 ? v.nao/tot*100 : 0;
    const scoreCls = score>=70?'score-high':score>=40?'score-mid':'score-low';
    const widthOuter = maxTot > 0 ? tot/maxTot*100 : 0;
    return `<div class="bar-row">
      <div class="lbl" title="${labelFn(k)}">${labelFn(k)}</div>
      <div class="bar-track" style="max-width:${widthOuter}%">
        ${fW>0?`<div class="bar-seg func" style="width:${fW}%" title="${v.func} funcionou">${v.func>0?v.func:''}</div>`:''}
        ${iW>0?`<div class="bar-seg indif" style="width:${iW}%" title="${v.indif} indiferente">${v.indif>0?v.indif:''}</div>`:''}
        ${nW>0?`<div class="bar-seg nao" style="width:${nW}%" title="${v.nao} não funcionou">${v.nao>0?v.nao:''}</div>`:''}
      </div>
      <span class="score-badge ${scoreCls}">${Math.round(score)}</span>
      <div class="tot">${tot}</div>
    </div>`;
  }).join('');
  return `<div class="chart-card">
    <h3>${titulo}</h3>
    <div class="chart-sub">${subtitulo}</div>
    ${rows}
  </div>`;
}

function _quantile(arr, q) {
  const a = [...arr].sort((x,y)=>x-y);
  const pos = (a.length - 1) * q;
  const lo = Math.floor(pos), hi = Math.ceil(pos);
  if (lo === hi) return a[lo];
  return a[lo] + (a[hi] - a[lo]) * (pos - lo);
}

// ─── ENGAJAMENTO (Feedback v2, 04/08/2026) ──────────────────────────────────
// Visão só pro Athila: quem aceitou (👍 no início), quem reportou o resultado
// (no fim) e quem ignorou (período fechou + janela passou sem NENHUMA resposta).
// Lê `item.feedbacks` (inclui o novo campo `aceite`). Alimenta a aba Análise.
const _PRAZO_DIAS_FB = {curto: 7, medio: 28, longo: 84};
const _JANELA_FB_DIAS = 7;
function _segundaISOWeek(ano, w) {
  const d = new Date(Date.UTC(ano, 0, 1 + (w - 1) * 7));
  const dow = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 1 - dow);
  return d;
}
function _statusEngaj(s, fb) {
  const m = String(s.id || '').match(/^(\d{4})-W(\d+)/);
  if (!m) return null;
  const dias = _PRAZO_DIAS_FB[s.prazo || 'curto'] || 7;
  const deadline = new Date(_segundaISOWeek(+m[1], +m[2]).getTime() + dias * 86400000);
  const fimJanela = new Date(deadline.getTime() + _JANELA_FB_DIAS * 86400000);
  const hoje = new Date();
  const aceitou = !!(fb && fb.aceite);
  const reportou = !!(fb && fb.acao);
  let estado;
  if (reportou) estado = 'reportou';
  else if (aceitou && hoje < deadline) estado = 'aceite_ativo';   // aceitou, período rolando
  else if (aceitou) estado = 'aceite_sem_resultado';              // aceitou mas não reportou o fim
  else if (hoje >= fimJanela) estado = 'ignorou';                 // fechou + janela passou, nada
  else if (hoje >= deadline) estado = 'aguardando';              // fechou, ainda na janela de cobrança
  else estado = 'ativo';                                          // período rolando, sem aceite ainda
  return {estado, aceitou, reportou};
}

function renderEngajamento() {
  // Só sugestões aprovadas, rastreáveis e escopo vendedora (respondente claro).
  const porVend = {};   // 'Vendedora|Loja' -> contadores
  const porLoja = {};   // 'L1' -> contadores
  let totalCard = 0;
  Object.values(SUGESTOES).forEach(sem => (sem.itens || []).forEach(s => {
    if ((s.status || 'pendente') !== 'aprovada') return;
    if (s.tipo === 'elogio') return;
    if (s.escopo !== 'vendedora' || !s.vendedora) return;
    const fb = (s.feedbacks || []).find(f => f.vendedora === s.vendedora && f.loja === s.loja);
    const st = _statusEngaj(s, fb);
    if (!st) return;
    totalCard++;
    const kv = s.vendedora + '|' + (s.loja || '');
    const ov = porVend[kv] || (porVend[kv] = {vend: s.vendedora, loja: s.loja || '', total: 0, aceite: 0, reportou: 0, ignorou: 0, pendente: 0});
    const ol = porLoja[s.loja] || (porLoja[s.loja] = {total: 0, aceite: 0, reportou: 0, ignorou: 0, pendente: 0});
    ov.total++; ol.total++;
    if (st.reportou) { ov.reportou++; ol.reportou++; if (st.aceitou) { ov.aceite++; ol.aceite++; } }
    else if (st.aceitou) { ov.aceite++; ol.aceite++; }
    else if (st.estado === 'ignorou') { ov.ignorou++; ol.ignorou++; }
    else { ov.pendente++; ol.pendente++; }
  }));

  if (totalCard === 0) {
    return `<div class="recents" style="margin-top:14px">
      <h3>🤝 Engajamento com as recomendações</h3>
      <div style="color:var(--muted);text-align:center;padding:14px 0;font-size:12px">Ainda sem recomendações individuais rastreáveis pra medir engajamento.</div>
    </div>`;
  }

  const linhas = Object.values(porVend)
    .sort((a, b) => (b.ignorou - a.ignorou) || (b.total - a.total) || a.vend.localeCompare(b.vend))
    .map(o => {
      const nomeLoja = (LOJAS_BASE[o.loja] && LOJAS_BASE[o.loja].nome) || o.loja || '—';
      const alerta = o.ignorou > 0 ? 'color:var(--red);font-weight:700' : 'color:var(--muted)';
      return `<div class="rec-row" style="display:grid;grid-template-columns:1.6fr .7fr .7fr .7fr .7fr;gap:6px;align-items:center">
        <div class="rec-ttl" style="font-weight:600">${o.vend} <span style="font-size:10px;color:var(--muted);font-weight:400">${nomeLoja}</span></div>
        <div style="text-align:center;font-size:12px">${o.total}</div>
        <div style="text-align:center;font-size:12px;color:var(--green)">${o.aceite}</div>
        <div style="text-align:center;font-size:12px;color:var(--blue)">${o.reportou}</div>
        <div style="text-align:center;font-size:12px;${alerta}">${o.ignorou || '—'}</div>
      </div>`;
    }).join('');

  const somaAceite = Object.values(porLoja).reduce((a, o) => a + o.aceite, 0);
  const somaReport = Object.values(porLoja).reduce((a, o) => a + o.reportou, 0);
  const somaIgnor  = Object.values(porLoja).reduce((a, o) => a + o.ignorou, 0);

  return `<div class="recents" style="margin-top:14px">
    <h3>🤝 Engajamento com as recomendações</h3>
    <div style="font-size:11px;color:var(--muted);margin:-4px 0 10px">Recomendações individuais aprovadas · 👍 aceitou no início · ✅ reportou o resultado · 🔕 ignorou (fechou sem responder).</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <div class="pill">👍 Aceites: <b style="color:var(--green)">${somaAceite}</b></div>
      <div class="pill">✅ Reportaram: <b style="color:var(--blue)">${somaReport}</b></div>
      <div class="pill">🔕 Ignoraram: <b style="color:${somaIgnor > 0 ? 'var(--red)' : 'var(--muted)'}">${somaIgnor}</b></div>
    </div>
    <div class="rec-row" style="display:grid;grid-template-columns:1.6fr .7fr .7fr .7fr .7fr;gap:6px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);padding-bottom:6px">
      <div>Vendedora</div><div style="text-align:center">Total</div><div style="text-align:center">👍</div><div style="text-align:center">✅</div><div style="text-align:center">🔕</div>
    </div>

  </div>`;
}

function renderAnalise() {
  const avalMap = loadAvaliacoes();
  const cardEngaj = renderEngajamento();

  // Card de Análise Sazonal sempre aparece no topo (não depende de avaliações)
  const cardSazonal = renderAnaliseSazonal();

  // Junta manual + automático (getResultadoEfetivo) pra contar o total avaliado real.
  // Antes só contava avalMap (manual) — subestimava, já que a maioria agora vem do
  // motor automático generalizado (ver [[premiacao_sugestoes_redesign]]).
  const todasComResultado = [];
  Object.values(SUGESTOES).forEach(sem => {
    sem.itens.forEach(s => {
      const ef = getResultadoEfetivo(s, avalMap);
      if (ef) todasComResultado.push({s, ef});
    });
  });
  const totAval = todasComResultado.length;
  const totManual = todasComResultado.filter(x => x.ef.origem === 'manual').length;
  const totAuto = totAval - totManual;

  if (totAval === 0) {
    return cardSazonal + cardEngaj + `<div class="analise-empty">
      <h2 style="color:var(--text);margin-bottom:8px">📊 Nenhuma avaliação ainda</h2>
      <p>Vá em <b>💡 Sugestões</b>, aplique algumas ações na semana e marque o resultado.<br>Os gráficos por tipo/loja/vendedora aparecem aqui assim que houver a primeira avaliação (manual ou automática).</p>
    </div>`;
  }

  const porTipo  = agruparPor(s => s.tipo);
  const porLoja  = agruparPor(s => s.loja || 'GERAL');
  const porVend  = agruparPor(s => s.vendedora || null);
  const porAlvo  = agruparPor(s => s.meta_alvo);

  // Recentes (últimas 10) — manuais ordenadas por data; automáticas não têm
  // "avaliado_em" (são recalculadas em runtime), então entram no fim, sinalizadas.
  const recentsManual = todasComResultado.filter(x => x.ef.origem === 'manual')
    .sort((a,b) => (avalMap[b.s.id]?.avaliado_em||'').localeCompare(avalMap[a.s.id]?.avaliado_em||''));
  const recentsAuto = todasComResultado.filter(x => x.ef.origem === 'automatico');
  const recentsHtml = [...recentsManual, ...recentsAuto].slice(0, 12).map(({s, ef}) => {
    const cor = ef.resultado==='funcionou'?'var(--green)':ef.resultado==='indiferente'?'var(--muted)':'var(--red)';
    const a = avalMap[s.id];
    const origemTag = ef.origem==='automatico' ? '<span style="font-size:9px;color:var(--blue);margin-left:6px">🤖 auto</span>' : '<span style="font-size:9px;color:var(--muted);margin-left:6px">✍️ manual</span>';
    return `<div class="rec-row">
      <div class="rec-aval" style="color:${cor}">${RES_LABELS[ef.resultado]}${origemTag}</div>
      <div class="rec-ttl">${s.titulo}${ef.origem==='automatico'&&ef.delta?` <span style="color:var(--muted);font-size:11px">— ${ef.delta}</span>`:''}${a?.comentario?` <span style="color:var(--muted);font-size:11px">— "${a.comentario.slice(0,80)}${a.comentario.length>80?'...':''}"</span>`:''}</div>
      <div class="rec-data">${a?.avaliado_em || ''}</div>
    </div>`;
  }).join('');

  return cardSazonal + cardEngaj + `
    <div class="sug-hdr" style="background:linear-gradient(135deg,rgba(34,197,94,.08),rgba(59,130,246,.05));border-color:rgba(34,197,94,.3)">
      <div>
        <h2 style="color:var(--green)">📊 Análise de Resultados</h2>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">Score = (funcionou × 100 + indiferente × 50) ÷ total · manual + automático (🤖 dado real do ERP)</div>
      </div>
      <div class="pill">Total avaliado: <b>${totAval}</b></div>
      <div class="pill">🤖 Automático: <b style="color:var(--blue)">${totAuto}</b></div>
      <div class="pill">✍️ Manual: <b>${totManual}</b></div>
    </div>
    <div class="chart-grid">
      ${renderChartCard('Por tipo de ação', 'Que tipo de iniciativa gera mais resultado', porTipo, k => TIPO_LABELS[k]||k)}
      ${renderChartCard('Por loja', 'Em qual loja as sugestões pegam mais', porLoja, k => k==='GERAL'?'GERAL':LOJAS_BASE[k]?.nome||k)}
      ${renderChartCard('Por vendedora', 'Quais vendedoras respondem melhor a feedback', porVend, k => k)}
      ${renderChartCard('Por KPI alvo', 'O que mexe em cada indicador', porAlvo, k => ALVO_LABELS[k]||k)}
    </div>
    <div class="recents">
      <h3>🕐 Últimas avaliações</h3>
      ${recentsHtml || '<div style="color:var(--muted);text-align:center;padding:14px 0;font-size:12px">—</div>'}
    </div>
  `;
}

  const hoje = new Date();
  const mk = hoje.getFullYear() + '-' + String(hoje.getMonth() + 1).padStart(2, '0');
  if (DADOS[mk]) return mk;
  const disponiveis = Object.keys(DADOS).filter(k => DADOS[k]).sort();
  return disponiveis[disponiveis.length - 1] || '2026-06';

}

function setTab(k) {
  curTab = k;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.k===k));

function updateMA(mesKey, lojaKey, semId, val) {
  DADOS[mesKey][lojaKey].marcasA_loja[semId] = parseFloat(val)||0;

}

function updateMAIndiv(mesKey, lojaKey, v, val) {
  if (!DADOS[mesKey][lojaKey].marcasA_indiv) DADOS[mesKey][lojaKey].marcasA_indiv = {};
  DADOS[mesKey][lojaKey].marcasA_indiv[v] = parseFloat(val)||0;
  rerender();
}

function rerender() {
  const el = document.getElementById('content');
  if (curTab === 'anual') { el.innerHTML = renderAnual(); return; }
  if (curTab === 'sugestoes') { el.innerHTML = renderSugestoes(); return; }
  if (curTab === 'analise') { el.innerHTML = renderAnalise(); return; }
  const d = DADOS[curMes];
  if (!d || !d[curTab]) {
    const metas = METAS_FUTURAS[curMes];
    el.innerHTML = `<div class="empty-mes">
      <h2>Sem dados — ${document.getElementById('hdr-sub').textContent}</h2>
      <p style="margin-top:8px">Meta configurada: ${metas?fR(metas[curTab]):'—'}</p>
      <p style="margin-top:6px;font-size:12px">Os dados serão preenchidos automaticamente ao rodar o agente ERP no início do mês.</p>
    </div>`;
    return;
  }
  el.innerHTML = renderLoja(curMes, curTab);
}

async function initDashboard() {
  // Retornos REAIS (aprovados) começam vazios — só são populados via Worker.
  // Textos sugeridos (rascunhos) ficam separados em TEXTOS_SUGERIDOS_RETORNO
  // e só pre-fill o textarea na UI (não contam como retorno aprovado).
  window.__FEEDBACK_RETORNOS = [];
  window.__TEXTOS_SUGERIDOS = TEXTOS_SUGERIDOS_RETORNO;
  setMes(curMes); // sincroniza seletor + cabeçalho com o mês corrente e renderiza
  // Em paralelo busca tudo do Worker
  try {
    const [oR, aR, fR, rR, mR,
           oS, aS, fS, rS] = await Promise.all([
      fetch(`${WORKER_URL}/overrides`, {cache: 'no-store'}),
      fetch(`${WORKER_URL}/avaliacoes`, {cache: 'no-store'}),
      fetch(`${WORKER_URL}/feedbacks`, {cache: 'no-store'}),
      fetch(`${WORKER_URL}/feedback-retornos`, {cache: 'no-store'}).catch(() => ({json: async () => ({items:[]})})),
      fetch(`${WORKER_URL}/metas-loja`, {cache: 'no-store'}).catch(() => ({json: async () => ({items:[]})})),
      // Supabase em paralelo (cada um null se falhar/tabela não existe ainda)
      supaSelect('sugestoes_overrides'),
      supaSelect('sugestoes_avaliacoes'),
      supaSelect('feedbacks'),
      supaSelect('feedback_retornos'),
    ]);
    // Junta Worker + Supabase (mais recente vence) → nada some na transição.
    const overrides  = mergeItens((await oR.json()).items, oS, x => x.id_sugestao);
    const avaliacoes = mergeItens((await aR.json()).items, aS, x => x.id_sugestao);
    const feedbacks  = mergeItens((await fR.json()).items, fS, x => `${x.id_sugestao}|${x.loja}|${x.vendedora}`);
    const retornos   = mergeItens((await rR.json()).items, rS, x => `${x.id_sugestao}|${x.loja}|${x.vendedora}`);
    const metasLoja  = (await mR.json()).items || [];

    // ── AJUSTES DE META (compartilhados via Worker) ──
    // O Worker é a fonte da verdade dos ajustes de meta: recebe tanto os que o
    // Athila faz no painel (setDecisaoMeta POSTa) quanto os que o agente
    // sincroniza. Aplicamos por cima do DADOS (por semana, Worker vence) e
    // espelhamos no localStorage pra o estado da UI (botão resetar) bater.
    // Sem isso, um ajuste feito em outro dispositivo (ou pelo agente) não
    // aparecia neste navegador — só o localStorage local valia.
    aplicarMetasWorkerNoDADOS(metasLoja);
    // Supabase é AUTORITATIVO — aplicado por último, vence Worker e localStorage.
    await lerEAplicarMetasSupabase(curMes);
    // Retornos aprovados vêm SÓ do Worker — sem mistura com sugestões.
    // status 'removido' = lápide (admin apagou). Some do painel e do app das vendedoras.
    window.__FEEDBACK_RETORNOS = (retornos || []).filter(r => r.status !== 'removido');

    // Mescla overrides no localStorage (mantém também o que ele fez localmente)
    const localOv = JSON.parse(localStorage.getItem('sugestoes_overrides') || '{}');
    for (const o of overrides) {
      if (!localOv[o.id_sugestao] || new Date(o.em) > new Date(localOv[o.id_sugestao].em||0)) {
        localOv[o.id_sugestao] = {status:o.status, texto_editado:o.texto_editado, prazo:o.prazo, em:o.em};
      }
    }
    localStorage.setItem('sugestoes_overrides', JSON.stringify(localOv));

    // Mescla avaliações
    const localAv = JSON.parse(localStorage.getItem('avaliacoes_premiacao') || '[]');
    for (const a of avaliacoes) {
      const idx = localAv.findIndex(x => x.id_sugestao === a.id_sugestao);
      if (idx < 0) localAv.push(a); else if (new Date(a.em||0) > new Date(localAv[idx].em||localAv[idx].avaliado_em||0)) localAv[idx] = {...a, avaliado_em: (a.em||'').slice(0,10)};
    }
    localStorage.setItem('avaliacoes_premiacao', JSON.stringify(localAv));

    // Dreno: o que só existe neste navegador sobe pro Worker/Supabase
    // (é de lá que o agente lê na Etapa 3 — zero Chrome MCP desde 04/07/2026)
    drenarLocalParaStores(overrides, avaliacoes, metasLoja);

    // Anexa feedbacks por sugestão (em memória, pra render mostrar)
    for (const sem of Object.values(SUGESTOES)) {
      if (!sem.itens) continue;
      for (const item of sem.itens) {
        item.feedbacks = feedbacks.filter(f => f.id_sugestao === item.id);
      }
    }

    rerender(); // re-render com dados frescos
  } catch (e) {
    console.warn('[init] worker fetch falhou - usando dados inline/localStorage:', e);
  }
}

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      setInterval(() => reg.update(), 60000);
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            console.log('[SW] versao nova detectada, atualizando...');
            setTimeout(() => location.reload(), 1500);
          }
        });
      });
    }).catch(e => console.warn('[SW] falha registro:', e));
  });
}
</script>

<script>
// Auto-update check: detecta mudanca via Last-Modified header (mais confiavel que SW)
(function(){
  let lastModified = null;
  async function checkUpdate() {
    try {
      const r = await fetch(location.pathname + '?_=' + Date.now(), {method:'HEAD', cache:'no-store'});
      const lm = r.headers.get('last-modified');
      if (!lm) return;
      if (lastModified === null) { lastModified = lm; return; }
      if (lm !== lastModified) {
        console.log('[auto-update] nova versao detectada');
        location.reload();
      }
    } catch(e) {}
  }
  window.addEventListener('load', () => {
    setTimeout(checkUpdate, 5000);
    setInterval(checkUpdate, 30000);
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) checkUpdate();
  });
})();
</script>
